<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="BMC Helix Partner Success: Icaro Technologies FY27 certification review. Certification data 9 Sep 2026; day counts at 11 Sep 2026.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%8F%B3%3C/text%3E%3C/svg%3E">
<title>Icaro Education Review FY27</title>
<style>
:root{
  color-scheme: light;
  --plane:#f9f9f7; --surface-1:#fcfcfb;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --brand:#12406f;
  --series-1:#185090; --series-2:#eb6834; --series-3:#1baf7a;
  --ord-1:#86b6ef; --ord-2:#4a86d0; --ord-3:#12406f;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-ink:#006300; --wash:rgba(18,64,111,0.07); --hover:rgba(11,11,11,0.035);
  --shadow:0 1px 2px rgba(11,11,11,.05), 0 6px 20px rgba(11,11,11,.05);
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0d0d0d; --surface-1:#1a1a19;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
  --brand:#5a9ae0;
  --series-1:#4a90d9; --series-2:#d95926; --series-3:#199e70;
  --ord-1:#8fbcf0; --ord-2:#4a90d9; --ord-3:#1d548f;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-ink:#0ca30c; --wash:rgba(90,154,224,0.13); --hover:rgba(255,255,255,0.04);
  --shadow:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --plane:#0d0d0d; --surface-1:#1a1a19;
    --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
    --brand:#5a9ae0;
    --series-1:#4a90d9; --series-2:#d95926; --series-3:#199e70;
    --ord-1:#8fbcf0; --ord-2:#4a90d9; --ord-3:#1d548f;
    --good-ink:#0ca30c; --wash:rgba(90,154,224,0.13); --hover:rgba(255,255,255,0.04);
    --shadow:none;
  }
}
*{box-sizing:border-box}
body{background:var(--plane); color:var(--text-primary);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; margin:0}

/* header */
.top{background:var(--surface-1); border-bottom:1px solid var(--border)}
.top-inner{max-width:1180px; margin:0 auto; padding:22px 22px 20px;
  display:flex; gap:22px; align-items:flex-start; justify-content:space-between; flex-wrap:wrap}
.eyebrow{font-size:11px; letter-spacing:.13em; text-transform:uppercase; color:var(--brand); font-weight:700; margin-bottom:9px}
h1{font-size:26px; line-height:1.2; margin:0 0 8px; letter-spacing:-.015em; max-width:24ch}
.sub{color:var(--text-secondary); margin:0; max-width:62ch; font-size:14.5px}
.top-right{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.seg{display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden}
.seg button{background:transparent; border:0; padding:7px 13px; font:inherit; font-size:13px;
  color:var(--text-secondary); cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand); color:#fff; font-weight:600}
.btn{background:var(--surface-1); border:1px solid var(--border); border-radius:6px; padding:7px 13px;
  font:inherit; font-size:13px; color:var(--text-secondary); cursor:pointer; text-decoration:none; display:inline-block}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--brand); color:#fff; border-color:var(--brand); font-weight:600}

/* tabs */
.tabs{background:var(--surface-1); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:20}
.tabs-inner{max-width:1180px; margin:0 auto; padding:0 22px; display:flex; gap:2px; overflow-x:auto}
.tab{background:transparent; border:0; border-bottom:2px solid transparent; padding:12px 15px;
  font:inherit; font-size:13.5px; color:var(--text-muted); cursor:pointer; white-space:nowrap}
.tab:hover{color:var(--text-primary)}
.tab[aria-selected="true"]{color:var(--brand); border-bottom-color:var(--brand); font-weight:600}

.wrap{max-width:1180px; margin:0 auto; padding:26px 22px 80px}
.panel[hidden]{display:none}
.section{margin-bottom:34px}
h2{font-size:19px; margin:0 0 5px; letter-spacing:-.01em}
h3{font-size:15px; margin:22px 0 8px}
.lede{color:var(--text-secondary); margin:0 0 16px; max-width:74ch; font-size:14.5px}
p{margin:0 0 12px} p:last-child{margin-bottom:0}
.card{background:var(--surface-1); border:1px solid var(--border); border-radius:8px;
  padding:18px 20px; box-shadow:var(--shadow); margin-bottom:14px}

/* tiles */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); gap:12px; margin-bottom:18px}
.tile{background:var(--surface-1); border:1px solid var(--border); border-radius:8px; padding:16px 17px;
  box-shadow:var(--shadow); position:relative; overflow:hidden}
.tile::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--axis)}
.tile.c::before{background:var(--critical)} .tile.w::before{background:var(--warning)}
.tile.g::before{background:var(--good)} .tile.b::before{background:var(--brand)}
.tile .v{font-size:29px; font-weight:600; letter-spacing:-.03em; font-variant-numeric:tabular-nums; line-height:1.05}
.tile.c .v{color:var(--critical)} .tile.w .v{color:var(--warning)} .tile.g .v{color:var(--good-ink)}
.tile .k{font-size:13px; color:var(--text-secondary); margin-top:6px; line-height:1.35}
.tile .s{font-size:11px; color:var(--text-muted); margin-top:6px; letter-spacing:.04em; text-transform:uppercase}

/* callouts */
.note{border-left:3px solid var(--brand); background:var(--wash); padding:14px 17px;
  border-radius:0 6px 6px 0; margin-bottom:14px}
.note.c{border-color:var(--critical); background:rgba(208,59,59,.08)}
.note.w{border-color:var(--warning); background:rgba(250,178,25,.10)}
.note.g{border-color:var(--good); background:rgba(12,163,12,.08)}
.note h3{margin:0 0 7px; font-size:14.5px}
.note ul{margin:8px 0 0; padding-left:19px} .note li{margin-bottom:5px; font-size:14px}
.note li:last-child{margin-bottom:0}

/* tables */
.tblwrap{background:var(--surface-1); border:1px solid var(--border); border-radius:8px;
  box-shadow:var(--shadow); overflow-x:auto; margin-bottom:12px}
table{border-collapse:collapse; width:100%; min-width:620px; font-size:13.5px}
thead th{background:var(--surface-1); text-align:left; padding:10px 13px; font-weight:600; font-size:11px;
  letter-spacing:.07em; text-transform:uppercase; color:var(--text-secondary);
  border-bottom:1px solid var(--border); white-space:nowrap; position:sticky; top:0; z-index:5}
thead th.n{text-align:right}
tbody td{padding:10px 13px; border-bottom:1px solid var(--border); vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hover)}
td.n{text-align:right; font-variant-numeric:tabular-nums; color:var(--text-secondary); white-space:nowrap}
td.n.k{color:var(--text-primary); font-weight:600}
td.nm{font-weight:600}
.em{display:block; font-size:11px; color:var(--text-muted); font-weight:400; margin-top:2px; word-break:break-all}
tr.sev-0 td.nm{box-shadow:inset 3px 0 0 var(--critical)}
tr.sev-1 td.nm{box-shadow:inset 3px 0 0 var(--serious)}
tr.sev-2 td.nm{box-shadow:inset 3px 0 0 var(--warning)}
tr.sev-3 td.nm{box-shadow:inset 3px 0 0 var(--good)}
.pill{display:inline-block; padding:1px 7px; border-radius:3px; font-size:11px; font-weight:600;
  letter-spacing:.03em; white-space:nowrap}
.p0{background:rgba(208,59,59,.14); color:var(--critical)}
.p1{background:rgba(236,131,90,.16); color:var(--serious)}
.p2{background:rgba(250,178,25,.16); color:var(--warning)}
.p3{background:rgba(12,163,12,.12); color:var(--good-ink)}
.pb{background:var(--wash); color:var(--brand)}
.zero{display:inline-block; margin-left:6px; padding:1px 6px; border-radius:3px; background:var(--critical);
  color:#fff; font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase}
.tags{margin-top:4px; display:flex; flex-wrap:wrap; gap:4px}
.tag{font-size:10.5px; padding:1px 6px; border-radius:3px; background:var(--wash); color:var(--text-secondary)}
.track{display:inline-block; width:96px; height:6px; background:var(--grid); border-radius:2px;
  overflow:hidden; vertical-align:middle}
.fill{display:block; height:100%}
.pct{margin-left:8px; font-size:12.5px; color:var(--text-muted); font-variant-numeric:tabular-nums}

/* expandable roster detail */
tr.row{cursor:pointer}
tr.row:focus-visible{outline:2px solid var(--brand); outline-offset:-2px}
tr.row td.nm{position:relative; padding-left:26px}
tr.row td.nm::before{content:"\25B8"; position:absolute; left:11px; top:10px; font-size:10px;
  color:var(--text-muted); transition:transform .12s ease}
tr.row.open td.nm::before{transform:rotate(90deg)}
tr.det > td{background:var(--plane); padding:0 13px 16px; border-bottom:1px solid var(--border)}
.detgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px; padding-top:4px}
.detcol h4{margin:0 0 7px; font-size:10.5px; letter-spacing:.09em; text-transform:uppercase;
  color:var(--text-secondary); font-weight:700; display:flex; align-items:baseline; gap:6px}
.detcol h4 span{font-weight:500; color:var(--text-muted); letter-spacing:0; text-transform:none; font-size:11px}
.li{display:flex; gap:8px; justify-content:space-between; align-items:flex-start;
  padding:6px 0; border-bottom:1px solid var(--rule-2)}
.li:last-child{border-bottom:0}
.li .lt{font-size:12.3px; line-height:1.35; color:var(--text-primary); min-width:0}
.li .lm{font-size:10.8px; color:var(--text-muted); margin-top:2px; line-height:1.3}
.li .lr{flex-shrink:0; display:flex; gap:4px; align-items:center}
.lvl{font-size:9.5px; font-weight:700; padding:1px 5px; border-radius:2px; letter-spacing:.03em}
.lvl.bcp{background:var(--wash); color:var(--brand)}
.lvl.bca{background:var(--hover); color:var(--text-secondary)}
.detbox{background:var(--surface-1); border:1px solid var(--border); border-radius:6px; padding:11px 13px;
  max-height:290px; overflow-y:auto}
.empty{font-size:11.8px; color:var(--text-muted); padding:5px 0; font-style:italic}
.detmeta{font-size:11.3px; color:var(--text-muted); padding:9px 0 2px}
.detmeta b{color:var(--text-secondary); font-weight:600}
.prog{display:inline-block; width:34px; height:4px; background:var(--grid); border-radius:2px;
  overflow:hidden; vertical-align:middle; margin-left:5px}
.prog i{display:block; height:100%; background:var(--brand)}
.hint{font-size:12px; color:var(--text-muted); margin:-6px 0 10px}
td.co{white-space:nowrap; font-variant-numeric:tabular-nums; text-align:right; color:var(--text-secondary)}
td.co b{color:var(--text-primary)}

/* plan tab visuals */
.wnum{position:absolute; left:15px; top:17px; width:24px; height:24px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;
  background:var(--brand); color:#fff}
.wave.c .wnum{background:var(--critical)} .wave.w .wnum{background:var(--warning)}
.wstat{display:flex; flex-wrap:wrap; gap:6px; margin:9px 0 2px}
.wstat span{font-size:11px; padding:2px 8px; border-radius:3px; background:var(--wash);
  color:var(--text-secondary); white-space:nowrap}
.wstat span b{color:var(--text-primary); font-weight:700; font-variant-numeric:tabular-nums}
.timeline{background:var(--surface-1); border:1px solid var(--border); border-radius:8px;
  padding:18px 18px 12px; box-shadow:var(--shadow); margin-bottom:16px; overflow-x:auto}
.timeline svg{display:block; width:100%; min-width:520px; height:auto}
.capbar{display:flex; height:26px; border-radius:4px; overflow:hidden; margin:10px 0 8px;
  border:1px solid var(--border)}
.capbar div{display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:600;
  color:#fff; min-width:0; overflow:hidden; white-space:nowrap}
.caplegend{display:flex; flex-wrap:wrap; gap:14px; font-size:11.5px; color:var(--text-secondary)}
.caplegend i{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:0}
.asks{list-style:none; padding:0; margin:0}
.asks li{display:flex; gap:10px; padding:11px 0; border-bottom:1px solid var(--rule-2); font-size:14px}
.asks li:last-child{border-bottom:0}
.asks .who{flex-shrink:0; width:52px; font-size:9.5px; font-weight:700; letter-spacing:.05em;
  text-transform:uppercase; padding:2px 0; color:var(--text-muted)}
.asks .box{flex-shrink:0; width:15px; height:15px; border:1.5px solid var(--axis); border-radius:3px; margin-top:2px}

/* controls */
.ctrls{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; align-items:center}
.ctrls input,.ctrls select{background:var(--surface-1); border:1px solid var(--border); border-radius:6px;
  padding:7px 11px; font:inherit; font-size:13px; color:var(--text-primary)}
.ctrls input{min-width:200px}
.count{font-size:12.5px; color:var(--text-muted); margin-left:auto}

/* chart */
.chart{background:var(--surface-1); border:1px solid var(--border); border-radius:8px; padding:20px 18px 12px;
  box-shadow:var(--shadow); margin-bottom:12px; overflow-x:auto}
.chart svg{display:block; width:100%; min-width:520px; height:auto}
.cap{font-size:12.5px; color:var(--text-muted); max-width:78ch; margin:0}

/* waves */
.wave{background:var(--surface-1); border:1px solid var(--border); border-left:3px solid var(--brand);
  border-radius:0 8px 8px 0; padding:17px 19px 17px 52px; box-shadow:var(--shadow); margin-bottom:12px;
  position:relative}
.wave.c{border-left-color:var(--critical)} .wave.w{border-left-color:var(--warning)}
.wave .when{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--text-muted); margin-bottom:5px}
.wave h3{margin:0 0 7px; font-size:15.5px}
.wave p{font-size:14px; color:var(--text-secondary)}
.wave ul{margin:8px 0 0; padding-left:19px; font-size:14px; color:var(--text-secondary)}
.wave li{margin-bottom:5px}

ul.plain{padding-left:19px; margin:0 0 12px} ul.plain li{margin-bottom:7px}
footer{border-top:1px solid var(--border); margin-top:20px; padding:18px 22px 40px; font-size:12.5px;
  color:var(--text-muted); max-width:1180px; margin-left:auto; margin-right:auto}
pre.tpl{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:12.5px; white-space:pre-wrap;
  background:var(--plane); border:1px solid var(--border); border-radius:6px; padding:14px; overflow-x:auto}
@media (max-width:640px){ h1{font-size:22px} .tile .v{font-size:25px} .wrap{padding:20px 15px 60px} }
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div>
      <div class="eyebrow" data-t="eyebrow"></div>
      <h1 data-t="h1"></h1>
      <p class="sub" data-t="sub"></p>
    </div>
    <div class="top-right">
      <div class="seg" role="group" aria-label="Language / Idioma">
        <button type="button" id="langEn" aria-pressed="true">English</button>
        <button type="button" id="langPt" aria-pressed="false">Português</button>
      </div>
      <button class="btn" id="themeBtn" type="button"></button>
      <a class="btn primary" id="mailTop" href="#" data-t="btnMail"></a>
    </div>
  </div>
</header>

<nav class="tabs">
  <div class="tabs-inner" role="tablist">
    <button class="tab" role="tab" data-p="overview" aria-selected="true" data-t="tabOverview"></button>
    <button class="tab" role="tab" data-p="roster" aria-selected="false" data-t="tabRoster"></button>
    <button class="tab" role="tab" data-p="certs" aria-selected="false" data-t="tabCerts"></button>
    <button class="tab" role="tab" data-p="coverage" aria-selected="false" data-t="tabCoverage"></button>
    <button class="tab" role="tab" data-p="plan" aria-selected="false" data-t="tabPlan"></button>
    <button class="tab" role="tab" data-p="notes" aria-selected="false" data-t="tabNotes"></button>
  </div>
</nav>

<div class="wrap">
  <section class="panel" id="p-overview" role="tabpanel">
    <div class="section" id="exec"></div>
    <div class="section" id="curve"></div>
    <div class="section" id="tierTbl"></div>
  </section>
  <section class="panel" id="p-roster" role="tabpanel" hidden>
    <div class="section" id="rosterHead"></div>
    <div class="ctrls">
      <input type="search" id="rq" placeholder="">
      <select id="rf"></select>
      <span class="count" id="rc"></span>
    </div>
    <div class="tblwrap"><table id="rosterTable"></table></div>
    <p class="cap" data-t="rosterCap"></p>
  </section>
  <section class="panel" id="p-certs" role="tabpanel" hidden>
    <div class="section" id="certsHead"></div>
    <div class="ctrls">
      <input type="search" id="cq" placeholder="">
      <select id="cw"></select>
      <select id="cl"></select>
      <span class="count" id="cc"></span>
    </div>
    <div class="tblwrap"><table id="certTable"></table></div>
  </section>
  <section class="panel" id="p-coverage" role="tabpanel" hidden>
    <div class="section" id="covHead"></div>
    <div class="tblwrap"><table id="covTable"></table></div>
    <div class="section" id="covNotes"></div>
  </section>
  <section class="panel" id="p-plan" role="tabpanel" hidden>
    <div class="section" id="planHead"></div>
    <div class="section" id="waves"></div>
    <div class="section" id="asks"></div>
  </section>
  <section class="panel" id="p-notes" role="tabpanel" hidden>
    <div class="section" id="notesBody"></div>
  </section>
</div>

  covNoteH:'Helix CMDB loses all eight certifications it holds',
  covNote:'It is the only area that goes to zero. AR System and Helix ITSM, the two largest, lose roughly three quarters each. Discovery loses half.',
  covNote2:'The newer areas hold up far better: Helix Operations Management keeps 11 of 14 and Service Monitoring keeps all three, because most of those were earned in 2026. The risk is concentrated in the classic ITSM core. Helix Data Manager no longer has a certified consultant: that coverage left with a departure, not through expiry.',
  progH:'Confirmed on the 28 August call',
  progL:'Answers to the questions Icaro raised — worth keeping somewhere findable',
  prog1H:'Certifications are unlimited',
  prog1:'Every consultant on the team can take as many certifications as they want. To be precise: <strong>unlimited first attempts</strong>. Retakes need approval this year, requested per person — as an Elite partner that approval is normally granted, and normally free. Ask rather than assume.',
  prog2H:'Instructor-led courses are included',
  prog2:'New this year: instructor-led courses come with Partner Success at no cost. They do not have to be paid for separately.',
  prog3H:'FY27 tier objectives are more flexible than FY26',
  prog3:'The certification and registered-service numbers came down deliberately — the programme is weighted toward quality this year. What is still expected: <strong>100% of delivery activity registered</strong>, and <strong>eight successful engagements completed within the year</strong>, with anything else you are engaged on registered alongside them. Eight is the target, not a cliff.',
  prog4H:'The partner portal is being rebuilt',
  prog4:'Until the new Partner Hub ships, service registrations can be handled by email rather than through the portal. Helix has direct input into that build — if the platform frustrates you once it is released, say so and it can be raised.',
  demoH:'Demo environment',
  demoP:'As an Elite partner, Icaro is eligible to request a <strong>persistent demo environment</strong>. Requests are reviewed for use case and capacity, then go for final approval. Capacity is limited, so each request is approved individually, and there is no date yet. To complete Icaro’s request, Partner Success needs:',
  demoL:'<li>demos per month, now and over the next six months</li><li>the products you plan to show</li><li>any planned development work</li><li>the number of users, plus an owner and a backup</li><li>LLM needs</li><li>whether the current environment is tied to a customer</li>',
  demoP2:'<strong>In the meantime, keep upgrading the existing environment</strong> rather than waiting.',
  contactH:'Who to contact',
  contactP:'<strong>Nikki Sanchez</strong>, Partner Success Manager, is your day-to-day contact. If you cannot reach her, <strong>Erica Garcia</strong> covers the same regions and can pick anything up, and the team can always be reached at <strong>partner.success@helixops.ai</strong>. <strong>Ruver Damasio</strong> is the Partner Manager for Brazil.',
  rosterFixH:'This list has been corrected',
  rosterFixP:'Reviewed live with Icaro on 28 August. Icaro sent its current employee list on 1 September, and the nine people who had left were archived, so the counts and percentages here reflect the current team. If anyone else has joined or left since, tell us and we will correct it at source.',
  tlH:'When the certifications fall',
  tlCap:'Each block is the number of certifications reaching their renewal date in that window. The three waves below follow these dates.',
  wCovers:'covers', wCerts:'certifications', wBcp:'BCP renewals', wPeople:'consultants',

  whoIcaro:'Icaro', whoHelix:'Helix', whoBoth:'Both',
  planH:'Proposed plan',
  planL:'Three waves, set by the dates rather than by preference',
  bcp7H:'Seven BCP renewals decide the tier',
  bcp7P:'These seven people hold a BCP that lapses before 31 October and have no other BCP to fall back on. <strong>Renewing any two of them restores the Elite floor of 10.</strong>',
  bcp7L:'<li><strong>Carlos Franco</strong>: Helix ITSM 22.x, 28 Sep</li><li><strong>Marcos Lelis</strong>: Helix ITSM 22.x, 29 Sep</li><li><strong>Marcelino Souza</strong>: Helix Digital Workplace 22.x, 29 Sep (Professional exam opened on 4 Sep)</li><li><strong>Victor Abreu</strong>: Helix ITSM 20.x (29 Sep), Helix ITSM 22.x (30 Sep), AR System 20.x for Developers (1 Oct), Helix CMDB 20.x (2 Oct)</li><li><strong>Heitor Martins</strong>: AR System 20.x for Developers, 6 Oct</li><li><strong>Mauricio Sorato</strong>: Helix ITSM 22.x, 6 Oct</li><li><strong>Daniel Ramos</strong>: Helix ITSM 22.x, 6 Oct</li>',
  bcp7Q:'<strong>Five of the seven need the same exam, Helix ITSM Professional:</strong> Carlos Franco, Marcos Lelis, Victor Abreu, Mauricio Sorato and Daniel Ramos. They can prepare as one group.',
  bcp7C:'Bruno Vignuda and Cardo Portugal also have BCPs lapsing in the coming weeks (Cardo’s Helix ITSM 22.x, on 18 September, is the first BCP to lapse), but their Helix Digital Workplace BCPs keep them in the count past October, so those renewals don’t move the number. That makes them well placed to coach the group.',
  w1when:'Wave 1 · by September 30', w1h:'Protect the Elite tier',
  w1p:'This window holds 57 of the 69 certifications that lapse by 31 October, and the seven BCP lapses above run from 28 September to 6 October. Those renewals decide whether Icaro is still at Elite on 31 October.',
  w1a:'Decide on the six credentials that expired on 3 and 10 September: renew or retire. Felipe Ascensio now holds no valid certification.',
  w1b:'Book the Helix ITSM Professional exam for Carlos Franco, Marcos Lelis, Victor Abreu, Mauricio Sorato and Daniel Ramos as one group, and support Marcelino Souza (exam already open) and Heitor Martins. Any two renewals restore the Elite floor.',
  w1c:'Check whether the 9 Professional exam enrolments already open belong to these people',
  w2when:'Wave 2 · October', w2h:'Rebuild CMDB and the ITSM core',
  w2p:'Helix CMDB goes to zero and AR System loses 19 of 24. Not everything needs renewing: what is needed is a decision on the minimum coverage each area must keep for work in flight.',
  w2a:'Set minimum coverage per solution area against active projects',
  w2b:'Prioritise Helix CMDB, AR System, Helix ITSM and Discovery',
  w2c:'Consider moving 20.x and 22.x holders straight to current versions rather than renewing in place',
  w3when:'Wave 3 · November and December', w3h:'Confirm and reactivate the wider learner base',
  w3p:'Fifty-seven learners hold Helix Learning accounts at Icaro without a certification, and several already have completed coursework. Icaro’s employee list named certified consultants only, so the first step is confirming who among them still works at Icaro.',
  w3a:'Restart the 26 onboardings stalled since 1 June',
  w3b:'Complete the 86 Associate exam enrolments already open',
  w3c:'Confirm which of the 57 uncertified learners are current employees, so the learning figures can be cleaned up',
  motionH:'What is already in motion',
  motionP:'The learning platform shows a wider picture than the 24 certified. After removing the nine departures, the course export of 7 September holds <strong>81 Icaro learners and 1,200 course records</strong>. Among the 24 certified consultants, 485 courses are completed, 223 in progress and 25 enrolled but not started. Open exam enrolments stand at 86 Associate and 9 Professional. Much of the renewal work is formally started and needs finishing rather than beginning. The other 57 learners hold no certification; because Icaro’s employee list named certified consultants only, we can’t yet confirm that all of them still work at Icaro.',
  motion1H:'Two things worth discussing',
  motion1:'<strong>A stalled onboarding wave.</strong> On 1 June 2026, 28 people were enrolled in <em>Welcome to Helix Learning</em>, and 26 still haven’t started. The count already excludes the nine departures, but it can’t tell us whether all 26 still work at Icaro. Worth checking, then understanding whether the rest is an access, communication or priority problem.',
  motion2:'<strong>Bootcamps completed in June.</strong> Seven consultants finished the <em>Advanced AIOps</em> and <em>ITSM/ITOM Container</em> bootcamps on June 17: Cardo Portugal, Cintia Cintra, Marcelo Pereira, Guilherme Dutra, Vinicius Agostini, Lucas Faloni and Claudio Cesar Flaviano. It is the most consistent group activity on record. The most recent activity is from September: Marcelino Souza opened his Helix Digital Workplace 22.x Professional exam on 4 September, and Claudio Cesar Flaviano completed <em>Innovation Studio 26.x Fundamentals Developing</em> on 6 September and enrolled in the 25.x instructor-led course and the Innovation Studio Associate exam.',
  asksH:'What we need from Icaro',
  ask1:'<strong>An owner for education.</strong> One point of contact for the renewal plan and for dealing with the Education team.',
  ask2:'<strong>A second BCP renewal committed.</strong> Marcelino Souza has opened his Professional exam. One more renewal from the seven whose BCP lapses before 31 October restores the Elite floor, and the five who share the Helix ITSM Professional exam are the natural place to find it.',
  ask3:'<strong>Minimum coverage per area.</strong> Which solution areas have to stay certified to serve the work in flight.',
  ask4:'<strong>The correct email domain.</strong> Certification records use <code>@icarotech.com</code>; other internal records use <code>@icaro.com.br</code>. We need to know which is current.',
  ask5:'<strong>The demo environment details.</strong> The six items listed under Demo environment above, so the request can move forward.',
  notesH1:'What is in here, and where it came from',
  notesP1:'Every figure on this page comes from two exports: the certification export dated <strong>9 September 2026</strong> and the course-progress export dated <strong>7 September 2026</strong>. Day counts and expiry windows are calculated against <strong>11 September 2026</strong>. The exports are <em>All Partners All Certifications by Partner</em> and <em>Partner Course Progress FY27</em>, both filtered to Icaro Technologies Serviços e Comércio Ltda, with the nine consultants Icaro confirmed had left removed: 138 certification records across 24 consultants. Tier criteria are from the <em>FY27 VAR Partner Success Program</em>, in effect since July 1, 2026.',
  notesP2:'Nothing here is modelled or projected. The decay curve is simply the renewal date recorded on each credential, counted forward.',
  notesRule:'<strong>How we count.</strong> “Active” means valid on 11 September 2026. Certifications whose renewal date has passed but that still read Active in the source are shown separately as just expired. The coverage table follows the same rule, so its “Expire by Oct 31” column adds up to the 69 in the headline.',
  notesH2:'Two limitations, stated plainly',
  notesL1:'<strong>We cannot see who still works at Icaro.</strong> The exports list credentials and courses, not employment. Icaro sent its current employee list on 1 September, and the nine people who had left were archived. That list named certified consultants only, so the 57 learners who hold no certification can’t be confirmed as current employees.',
  notesL2:'<strong>Certifications that still read Active after their renewal date are treated here as just expired.</strong> Three fall into that category on 11 September, all with a renewal date of 10 September. The source system still counts them as active, which means reports run from it overstate Icaro by three until it catches up.',
  notesH3:'What this review does not cover',
  notesP3:'CSAT, delivery engagement registration and escalation history are all part of the FY27 tier criteria and none of them are assessed here. Icaro has no CSAT surveys on record, which is not a low score — it is an absence, and it is worth fixing before any tier review.',
  notesH4:'Questions or corrections',
  notesP4:'If a name, a date or a count is wrong, tell us and we will correct it at source rather than annotating around it. Corrections to the roster are the most useful thing you can send back.',
  footer:'Prepared by Partner Success · BMC Helix · Reviewed with Icaro on the cadence call of 28 August 2026 · Sources: certification export dated 9 September 2026 and course export dated 7 September 2026 (All Partners All Certifications and Partner Course Progress FY27) · day counts at 11 September 2026. Contains no commercial information.'
},
pt:{
  eyebrow:'BMC Helix · Partner Success · Revisão de Certificações',
  h1:'A base certificada da Icaro vence em blocos até outubro',
  sub:'126 certificações válidas em 24 consultores, a maioria emitida numa única onda de setembro de 2024. Os prazos de dois anos vencem juntos: 57 vencem até 30 de setembro e 69 até 31 de outubro.',

  execH:'O que isto diz',
  execGoodH:'O que a Icaro construiu',
  execGood:'A Icaro tem uma das maiores bases certificadas do portfólio LATAM: <strong>24 consultores certificados, 126 certificações válidas, 13 áreas de solução</strong>. Nove consultores deixaram a empresa recentemente, e estes números já estão corrigidos para isso. Este não é um problema de desempenho.',
  execGapH:'O problema é de calendário',
  execGap:'A maior parte da base foi emitida em <strong>setembro de 2024</strong>, num único esforço concentrado, com validade de dois anos. Ela vence no mesmo mês em que foi conquistada e leva consigo boa parte da qualificação técnica que sustenta o nível Elite da Icaro. <strong>Mais três vencem em 12 de setembro, cinquenta e sete até 30 de setembro e sessenta e nove até 31 de outubro</strong>, a última delas em 7 de outubro. As primeiras tentativas são ilimitadas e sem custo neste ano, portanto isto é uma questão de agendamento e não de orçamento, e a janela organizada agora vai até o fim de setembro.',

  t2k:'vencem até 31 de outubro: 55% da base válida', t2s:'57 em setembro, 12 em outubro',

  lapsedH:'Três credenciais venceram em 10 de setembro e ainda aparecem como ativas',
  lapsedP:'A data de renovação delas passou em <strong>10 de setembro de 2026</strong>, mas o sistema de origem ainda não refletiu a mudança, então qualquer consulta feita hoje mostra a Icaro com três credenciais a mais do que ela realmente tem. Esta página as conta como recém-vencidas. Outras três venceram em <strong>3 de setembro</strong>: Helix ITSM 22.x for Administrators, de Cardo Portugal e de Felipe Ascensio, e AR System 22.x for Administrators, de Claudio Cesar Flaviano. <strong>Felipe Ascensio agora não tem nenhuma certificação válida.</strong> O AR System 22.x de Cardo, a credencial apontada na edição anterior, agora aparece como vencido na origem, então essa divergência está resolvida.',
  chgH:'O que mudou desde 1º de setembro',
  chg1:'<strong>Nada foi renovado nem conquistado.</strong> A exportação de 9 de setembro não mostra nenhuma certificação nova. Seis venceram: três em 3 de setembro e três em 10 de setembro. Felipe Ascensio agora está sem nenhuma certificação.',
  chg2:'<strong>Um movimento positivo:</strong> Marcelino Souza abriu o exame Professional de Helix Digital Workplace 22.x em 4 de setembro. A BCP dele vence em 29 de setembro, então esta é uma das renovações que podem recompor o piso.',
  chg3:'A curva do nível não mudou: 15 profissionais BCP hoje, 12 em 30 de setembro e 8 em 31 de outubro. O piso Elite continua sendo cruzado em 31 de outubro.',
  chg4:'As janelas de certificação foram renomeadas. “jan.–jun. 2027” é o restante do FY27, e “Após junho de 2027” substitui “2028 ou depois”, que colocava os vencimentos de dezembro de 2027 em 2028.',
  chg5:'“Ativa” agora significa válida na data de referência. Certificações com a data já passada que ainda aparecem como ativas na origem são mostradas como recém-vencidas, e a tabela de cobertura segue a mesma regra, então a coluna “Vencem até 31 out” agora soma os 69 do destaque.',
  chg6:'Correção: a edição anterior dizia que a BCP restante de Claudio Cesar Flaviano valia só até 29 de dezembro de 2026. A BCP de Helix Digital Workplace 22.x dele vale até 15 de março de 2028.',
  curveH:'A curva de vencimento',
  curveL:'Profissionais com certificação BCP ao longo do tempo',
  curveCap:'<strong>Como ler:</strong> o programa FY27 conta <strong>pessoas certificadas em nível BCP</strong>, não certificados. Uma pessoa com três BCPs conta como uma. O piso do nível Elite são 10 pessoas; o do Premier, 6. A Icaro tem 15 hoje, 12 em 30 de setembro e 8 em 31 de outubro: duas abaixo do piso Elite, e confortavelmente acima do piso Premier de 6. Sete pessoas têm uma BCP que vence antes dessa data, sem outra BCP para compensar, e a renovação de quaisquer duas delas recompõe o Elite.',

  prog1:'Cada consultor da equipe pode fazer quantas certificações quiser. Para ser exato: <strong>primeiras tentativas ilimitadas</strong>. As reprovações com nova tentativa precisam de aprovação neste ano, solicitada por pessoa — como parceiro Elite, essa aprovação normalmente é concedida, e normalmente sem custo. Perguntem, em vez de presumir.',
  prog2H:'Os cursos com instrutor estão incluídos',
  prog2:'Novidade deste ano: os cursos ministrados por instrutor fazem parte do Partner Success, sem custo. Não é preciso pagar por eles à parte.',
  prog3H:'Os objetivos de nível do FY27 são mais flexíveis que os do FY26',
  prog3:'Os números de certificações e de serviços registrados foram reduzidos de propósito — o programa deste ano dá mais peso à qualidade. O que continua sendo esperado: <strong>100% da atividade de entrega registrada</strong> e <strong>oito engajamentos concluídos com sucesso dentro do ano</strong>, com os demais engajamentos em andamento também registrados. Oito é a meta, não um corte.',

let L = 'en';
function t(k, vars){
  let s = (I[L] && I[L][k] !== undefined) ? I[L][k] : (I.en[k] !== undefined ? I.en[k] : k);
  if (vars) for (const kk in vars) s = String(s).split('{'+kk+'}').join(vars[kk]);
  return s;
}

/* ---------- theme ---------- */
let ready = false;
const themeBtn = $('#themeBtn');
function curTheme(){
  const a = document.documentElement.getAttribute('data-theme');
  if (a) return a;
  return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
}
function setTheme(x){
  document.documentElement.setAttribute('data-theme', x);
  themeBtn.textContent = x === 'dark' ? t('light') : t('dark');
  if (ready) drawCurve();
}
themeBtn.onclick = () => setTheme(curTheme() === 'dark' ? 'light' : 'dark');

function drawCurve(){
  const box = $('#curve');
  const w = Math.max(520, (box.clientWidth || 900) - 40), h = 300;
  const L0 = 46, R = 18, T = 24, B = 42;
  const maxY = 20;
  const X = i => L0 + (i / (TL.length - 1)) * (w - L0 - R);
  const Y = v => T + (maxY - v) / maxY * (h - T - B);
  const keys = ['rowNow','rowSep','rowOct','rowDec','rowMar','rowJun'];
  const shortLbl = ['Sep 11','Sep 30','Oct 31','Dec 31','Mar 31','Jun 30'];
  const shortPt  = ['11 set','30 set','31 out','31 dez','31 mar','30 jun'];
  const lbl = L === 'pt' ? shortPt : shortLbl;
  let d = '';
  TL.forEach((p, i) => {
    if (i === 0) d += `M ${X(0).toFixed(1)} ${Y(p.v).toFixed(1)}`;
    else d += ` L ${X(i).toFixed(1)} ${Y(TL[i-1].v).toFixed(1)} L ${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}`;
  });
  const areaD = d + ` L ${X(TL.length-1).toFixed(1)} ${Y(0).toFixed(1)} L ${X(0).toFixed(1)} ${Y(0).toFixed(1)} Z`;
  let grid = '';
  [0,5,10,15,20].forEach(v => {
    grid += `<line x1="${L0}" y1="${Y(v).toFixed(1)}" x2="${w-R}" y2="${Y(v).toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>`;
    grid += `<text x="${L0-9}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" font-size="11.5" fill="var(--text-muted)">${v}</text>`;
  });
  let pts = '';
  TL.forEach((p, i) => {
    const col = p.v < A.eliteFloor ? 'var(--critical)' : 'var(--brand)';
    pts += `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="4.5" fill="var(--surface-1)" stroke="${col}" stroke-width="2.5"/>`;
    pts += `<text x="${X(i).toFixed(1)}" y="${(Y(p.v)-13).toFixed(1)}" text-anchor="middle" font-size="14" font-weight="600" fill="var(--text-primary)">${p.v}</text>`;
    pts += `<text x="${X(i).toFixed(1)}" y="${(h-B+19).toFixed(1)}" text-anchor="middle" font-size="11.5" fill="var(--text-muted)">${lbl[i]}</text>`;
  });
  const eliteTxt = L === 'pt' ? 'PISO ELITE — 10 PESSOAS' : 'ELITE FLOOR — 10 PEOPLE';
  const premTxt  = L === 'pt' ? 'PISO PREMIER — 6 PESSOAS' : 'PREMIER FLOOR — 6 PEOPLE';
  box.innerHTML = `
    <h2>${t('curveH')}</h2>
    <p class="lede">${t('curveL')}</p>
    <div class="chart">
      <svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(t('curveL'))}">
        <defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="var(--brand)" stop-opacity="0.20"/>
          <stop offset="1" stop-color="var(--brand)" stop-opacity="0"/>
        </linearGradient></defs>
        ${grid}
        <path d="${areaD}" fill="url(#cg)"/>
        <line x1="${L0}" y1="${Y(10).toFixed(1)}" x2="${w-R}" y2="${Y(10).toFixed(1)}" stroke="var(--critical)" stroke-width="1.5" stroke-dasharray="6 4"/>
        <text x="${w-R}" y="${(Y(10)-8).toFixed(1)}" text-anchor="end" font-size="10.5" font-weight="700" letter-spacing="0.07em" fill="var(--critical)">${eliteTxt}</text>
        <line x1="${L0}" y1="${Y(6).toFixed(1)}" x2="${w-R}" y2="${Y(6).toFixed(1)}" stroke="var(--warning)" stroke-width="1.5" stroke-dasharray="6 4"/>
        <text x="${w-R}" y="${(Y(6)-8).toFixed(1)}" text-anchor="end" font-size="10.5" font-weight="700" letter-spacing="0.07em" fill="var(--warning)">${premTxt}</text>
        <path d="${d}" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>
        ${pts}
      </svg>
    </div>
    <p class="cap">${t('curveCap')}</p>`;
}

function buildTier(){
  const keys = ['rowNow','rowSep','rowOct','rowDec','rowMar','rowJun'];
  const rows = TL.map((p, i) => {
    const tier = p.v >= 10 ? 'Elite' : p.v >= 6 ? 'Premier' : 'Authorized';
    const m = p.v - 10;
    const sv = m > 3 ? 3 : m > 0 ? 2 : m === 0 ? 1 : 0;
    const margin = m === 0 ? `0 <span style="color:var(--text-muted)">&mdash; ${t('onLine')}</span>` : (m > 0 ? '+' + m : '&minus;' + Math.abs(m));
    return `<tr class="sev-${sv}"><td class="nm">${t(keys[i])}</td><td class="n k">${p.v}</td><td>${tier}</td><td class="n">${margin}</td></tr>`;
  }).join('');
  $('#tierTbl').innerHTML = `
    <h2>${t('tierH')}</h2>
    <p class="lede">${t('tierL')}</p>
    <div class="tblwrap"><table>
      <thead><tr><th>${t('thDate')}</th><th class="n">${t('thBcp')}</th><th>${t('thTier')}</th><th class="n">${t('thMargin')}</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <p class="cap">${t('tierCap')}</p>`;
}

const DICT = DATA.dict || {t:[],c:[],d:[]};
const BENCH = DATA.bench || [];
const openRows = new Set();

function fd2(s){                      // "26-09-03" -> localised
  if (!s) return '—';
  const [y,m,d] = s.split('-').map(Number);
  return L === 'pt' ? `${d} ${MON.pt[m-1]} 20${String(y).padStart(2,'0')}`
                    : `${MON.en[m-1]} ${d}, 20${String(y).padStart(2,'0')}`;
}

function certLi(c){
  const sv = c.s === 'expired' ? 0 : sev(c.d);
  const lab = c.s === 'expired' ? t('stExpired') : c.s === 'lapsed' ? t('stLapsed') : t('pil' + sv);
  return `<div class="li">
    <div class="lt">${esc(c.t)}
      <div class="lm">${esc(c.a)} · ${t('liIssued',{i:c.i.slice(2)? fd2(c.i.slice(2)) : c.i})}<b style="color:${sv<2?'var(--critical)':'var(--text-secondary)'}">${fd2(c.r.slice(2))}</b></div>
    </div>
    <div class="lr"><span class="lvl ${c.l==='BCP'?'bcp':'bca'}">${c.l}</span>
      <span class="pill p${sv}">${lab}</span></div></div>`;
}

function courseLi(c, showDone){
  const [ti, ci, di, st, en, fi, pr] = c;
  const meta = [DICT.c[ci], DICT.d[di]].filter(Boolean).join(' · ');
  const when = showDone ? (fi ? t('liDone',{d:fd2(fi)}) : '') : (en ? t('liEnrolled',{d:fd2(en)}) : '');
  const chip = st === 0 ? `<span class="pill p3">${t('stDone')}</span>`
             : st === 1 ? `<span class="pill p2">${t('stProg')}</span>`
                        : `<span class="pill pb">${t('stNew')}</span>`;
  const bar = (!showDone && pr) ? `<span class="prog"><i style="width:${Math.min(100,pr)}%"></i></span>` : '';
  return `<div class="li">
    <div class="lt">${esc(ti!=null?DICT.t[ti]:'')}
      <div class="lm">${esc(meta)}${meta&&when?' · ':''}${when}${bar}</div></div>
    <div class="lr">${chip}</div></div>`;
}

function detailRow(p, cols){
  const certs = p.ce || [];
  const co = p.co || [];
  const open = co.filter(c => c[3] !== 0);
  const done = co.filter(c => c[3] === 0)
                 .sort((a,b) => String(b[5]||'').localeCompare(String(a[5]||'')));
  const certHtml = certs.length ? certs.map(certLi).join('') : `<div class="empty">${t('emptyCerts')}</div>`;
  const openHtml = open.length ? open.map(c => courseLi(c,false)).join('') : `<div class="empty">${t('emptyOpen')}</div>`;
  const doneHtml = done.length ? done.map(c => courseLi(c,true)).join('') : `<div class="empty">${t('emptyDone')}</div>`;
  const act = p.la ? t('lastAct',{d:fd2(p.la)}) : t('noAct');
  return `<tr class="det"><td colspan="${cols}">
    <div class="detmeta">${act} · ${t('courseTot',{n:co.length, d:p.cd||0, p:p.cp||0, w:p.cn||0})}</div>
    <div class="detgrid">
      <div class="detcol"><h4>${t('detCerts')} <span>${certs.length}</span></h4><div class="detbox">${certHtml}</div></div>
      <div class="detcol"><h4>${t('detOpen')} <span>${open.length}</span></h4><div class="detbox">${openHtml}</div></div>
      <div class="detcol"><h4>${t('detDone')} <span>${done.length}</span></h4><div class="detbox">${doneHtml}</div></div>
    </div></td></tr>`;
}

  const q = ($('#rq').value || '').toLowerCase().trim();

  const bench = f === 'bench';
  const src = bench ? BENCH : P;
  const rows = src.filter(p => {
    if (!bench && f !== 'all' && String(sev(p.d)) !== f) return false;
    if (q && !p.n.toLowerCase().includes(q)) return false;
    return true;
  });
  $('#rc').textContent = t(bench ? 'showingB' : 'showing', {n: rows.length, m: src.length});
  const cols = 8;
  $('#rosterTable').innerHTML = `
    <thead><tr>
      <th>${t('thCons')}</th><th class="n">${t('thBCP')}</th><th class="n">${t('thBCA')}</th>
      <th class="n">${t('thAct')}</th><th class="n">${t('thLose')}</th><th class="n">${t('thKeep')}</th>
      <th class="n">${t('thCourses')}</th><th>${t('thNext')}</th>
    </tr></thead>
    <tbody>${rows.map(p => {
      const s = bench ? 3 : sev(p.d);
      const lab = bench ? '' : (p.d < 0 ? t('pilExp') : t('pil' + s));
      const isOpen = openRows.has(p.n);
      const co = `<b>${p.cd||0}</b><span style="color:var(--text-muted)"> / ${(p.cp||0)+(p.cn||0)}</span>`;
      return `<tr class="row sev-${s}${isOpen?' open':''}" data-k="${esc(p.n)}" tabindex="0">
        <td class="nm">${esc(p.n)}${(!bench && p.keep === 0) ? `<span class="zero">${L==='pt'?'zera':'zero'}</span>` : ''}
          <div class="tags">${(p.a||[]).map(a => `<span class="tag">${esc(a)}</span>`).join('')}</div></td>
        <td class="n">${p.bcp || '&mdash;'}</td><td class="n">${p.bca || '&mdash;'}</td>
        <td class="n">${p.act || '&mdash;'}</td><td class="n">${p.lose || '&mdash;'}</td>
        <td class="n k">${bench ? '&mdash;' : p.keep}</td>
        <td class="co">${co}</td>
        <td class="n">${bench ? '&mdash;' : fdate(p.r)} ${lab?`<span class="pill p${s}">${lab}</span>`:''}</td></tr>`
        + (isOpen ? detailRow(p, cols) : '');
    }).join('')}</tbody>`;
  $$('#rosterTable tbody tr.row').forEach(tr => {
    const toggle = () => { const k = tr.dataset.k; openRows.has(k) ? openRows.delete(k) : openRows.add(k); renderRoster(); };
    tr.onclick = toggle;
    tr.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); } };
  });
}

/* ---------- certs ---------- */
const PBY = {}; [...P, ...BENCH].forEach(p => PBY[p.n] = p);
const openCerts = new Set();

function renderCerts(){
  const q = ($('#cq').value || '').toLowerCase().trim();
  const w = $('#cw').value, lv = $('#cl').value;
  const rows = C.filter(c => {
    if (w !== 'all' && c.w !== w) return false;
    if (lv !== 'all' && c.l !== lv) return false;
    if (q && !(c.n.toLowerCase().includes(q) || c.t.toLowerCase().includes(q) || c.a.toLowerCase().includes(q))) return false;
    return true;
  }).sort((a, b) => a.d - b.d);
  $('#cc').textContent = t('showingC', {n: rows.length, m: C.length});
  $('#certTable').innerHTML = `
    <thead><tr>
      <th>${t('thCons')}</th><th>${t('thCert')}</th><th>${t('thLvl')}</th>
      <th>${t('thArea')}</th><th class="n">${t('thIssued')}</th><th class="n">${t('thRenew')}</th>
    </tr></thead>
    <tbody>${rows.map((c, i) => {
      const s = c.s === 'expired' ? 0 : sev(c.d);
      const lab = c.s === 'expired' ? t('stExpired') : c.s === 'lapsed' ? t('stLapsed') : t('pil' + s);
      const key = c.n + '|' + c.t + '|' + c.r;
      const isOpen = openCerts.has(key);
      const p = PBY[c.n];
      return `<tr class="row sev-${s}${isOpen?' open':''}" data-k="${esc(key)}" tabindex="0">
        <td class="nm">${esc(c.n)}</td>
        <td>${esc(c.t)}</td>
        <td><span class="pill pb">${c.l}</span></td>
        <td>${esc(c.a)}</td>
        <td class="n">${fdate(c.i)}</td>
        <td class="n">${fdate(c.r)} <span class="pill p${s}">${lab}</span></td></tr>`
        + (isOpen && p ? detailRow(p, 6) : '');
    }).join('')}</tbody>`;
  $$('#certTable tbody tr.row').forEach(tr => {
    const toggle = () => { const k = tr.dataset.k; openCerts.has(k) ? openCerts.delete(k) : openCerts.add(k); renderCerts(); };
    tr.onclick = toggle;
    tr.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); } };
  });
}

/* ---------- coverage ---------- */
const openAreas = new Set();

function areaDetail(area, cols){
  const mine = C.filter(c => c.a === area && c.s === 'active').sort((a,b) => a.d - b.d);   // valid on the reference date, same rule as the table
  const going = mine.filter(c => c.r <= '2026-10-31');
  const staying = mine.filter(c => c.r > '2026-10-31');
  const people = new Set(mine.map(c => c.n));
  const li = c => {
    const sv = sev(c.d);
    const lab = c.s === 'lapsed' ? t('stLapsed') : t('pil' + sv);
    return `<div class="li">
      <div class="lt">${esc(c.n)}<div class="lm">${esc(c.t)}</div></div>
      <div class="lr"><span class="lvl ${c.l==='BCP'?'bcp':'bca'}">${c.l}</span>
        <span style="font-size:11px;color:${sv<2?'var(--critical)':'var(--text-secondary)'};white-space:nowrap">${fdate(c.r)}</span>
        <span class="pill p${sv}">${lab}</span></div></div>`;
  };
  return `<tr class="det"><td colspan="${cols}">
    <div class="detmeta">${t('areaPeople',{n:people.size, c:mine.length})}</div>
    <div class="detgrid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">
      <div class="detcol"><h4 style="color:var(--critical)">${t('areaGoing')} <span>${going.length}</span></h4>
        <div class="detbox">${going.length ? going.map(li).join('') : `<div class="empty">${t('emptyOpen')}</div>`}</div></div>
      <div class="detcol"><h4 style="color:var(--good-ink)">${t('areaStaying')} <span>${staying.length}</span></h4>
        <div class="detbox">${staying.length ? staying.map(li).join('') : `<div class="empty">${t('emptyStaying')}</div>`}</div></div>
    </div></td></tr>`;
}

function buildCov(){
  const rows = COV.map(c => {
    const pct = Math.round(c.l / c.t * 100);
    const tone = pct >= 75 ? 0 : pct >= 40 ? 2 : 3;
    const col = pct >= 75 ? 'var(--critical)' : pct >= 40 ? 'var(--warning)' : 'var(--good)';
    const isOpen = openAreas.has(c.a);
    return `<tr class="row sev-${tone}${isOpen?' open':''}" data-k="${esc(c.a)}" tabindex="0">
      <td class="nm">${esc(c.a)}</td><td class="n">${c.t}</td>
      <td class="n">${c.l || '&mdash;'}</td><td class="n k">${c.k}</td>
      <td><span class="track"><span class="fill" style="width:${pct}%;background:${col}"></span></span><span class="pct">${pct}%</span></td></tr>`
      + (isOpen ? areaDetail(c.a, 5) : '');
  }).join('');
  $('#covHead').innerHTML = `<h2>${t('covH')}</h2><p class="lede">${t('covL')}</p><p class="hint">${t('clickHintV')}</p>`;
  $('#covTable').innerHTML = `
    <thead><tr><th>${t('thAreaC')}</th><th class="n">${t('thNow')}</th><th class="n">${t('thLoseC')}</th>
    <th class="n">${t('thKeepC')}</th><th>${t('thExp')}</th></tr></thead><tbody>${rows}</tbody>`;
  $('#covNotes').innerHTML = `<div class="note w"><h3>${t('covNoteH')}</h3><p>${t('covNote')}</p><p>${t('covNote2')}</p></div>`;
  $$('#covTable tbody tr.row').forEach(tr => {
    const toggle = () => { const k = tr.dataset.k; openAreas.has(k) ? openAreas.delete(k) : openAreas.add(k); buildCov(); };
    tr.onclick = toggle;
    tr.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(); } };
  });
}

/* ---------- plan ---------- */
function planWindows(){
  const act = C.filter(c => c.s === 'active');   // valid on the reference date only, so buckets 1+2 match the 69 quoted elsewhere
  const W = [
    {k:'w1', to:'2026-09-30', lab:{en:'To 30 Sep', pt:'Até 30 set'}},
    {k:'w2', to:'2026-10-31', lab:{en:'October',   pt:'Outubro'}},
    {k:'w3', to:'2026-12-31', lab:{en:'Nov–Dec',   pt:'Nov–dez'}},
    {k:'w4', to:'2099-01-01', lab:{en:'2027+',     pt:'2027+'}},
  ];
  let prev = '0000-00-00';
  return W.map(w => {
    const sel = act.filter(c => c.r > prev && c.r <= w.to);
    const o = {...w, n: sel.length,
      bcp: sel.filter(c => c.l === 'BCP').length,
      ppl: new Set(sel.map(c => c.n)).size};
    prev = w.to; return o;
  });
}

function drawTimeline(){
  const W = planWindows();
  const max = Math.max(...W.map(w => w.n)) || 1;
  const box = $('#planHead');
  const w = Math.max(520, (box.clientWidth || 860) - 40), h = 168;
  const L0 = 8, R = 8, T = 26, B = 40;
  const gap = 12, bw = (w - L0 - R - gap * (W.length - 1)) / W.length;
  const bars = W.map((d, i) => {
    const x = L0 + i * (bw + gap);
    const bh = Math.max(4, (d.n / max) * (h - T - B));
    const y = h - B - bh;
    const col = i === 0 ? 'var(--critical)' : i === 1 ? 'var(--serious)' : i === 2 ? 'var(--warning)' : 'var(--good)';
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${col}" opacity="0.88"/>
      <text x="${(x+bw/2).toFixed(1)}" y="${(y-8).toFixed(1)}" text-anchor="middle" font-size="17" font-weight="600" fill="var(--text-primary)">${d.n}</text>
      <text x="${(x+bw/2).toFixed(1)}" y="${(h-B+17).toFixed(1)}" text-anchor="middle" font-size="12" fill="var(--text-secondary)">${d.lab[L] || d.lab.en}</text>
      <text x="${(x+bw/2).toFixed(1)}" y="${(h-B+31).toFixed(1)}" text-anchor="middle" font-size="10.5" fill="var(--text-muted)">${d.bcp} BCP</text>`;
  }).join('');
  return `<div class="timeline">
    <svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(t('tlH'))}">
      <line x1="${L0}" y1="${h-B}" x2="${w-R}" y2="${h-B}" stroke="var(--axis)" stroke-width="1"/>
      ${bars}
    </svg></div>
    <p class="cap" style="margin-bottom:18px">${t('tlCap')}</p>`;
}

function buildPlan(){
  const W = planWindows();
  $('#planHead').innerHTML = `<h2>${t('planH')}</h2><p class="lede">${t('planL')}</p>`
    + `<div class="note c"><h3>${t('bcp7H')}</h3><p>${t('bcp7P')}</p><ul>${t('bcp7L')}</ul>`
    + `<p style="margin-top:12px">${t('bcp7Q')}</p><p>${t('bcp7C')}</p></div>`
    + `<h3 style="margin-top:22px">${t('tlH')}</h3>` + drawTimeline();

  const stat = d => `<div class="wstat">
      <span>${t('wCovers')} <b>${d.n}</b> ${t('wCerts')}</span>
      <span><b>${d.bcp}</b> ${t('wBcp')}</span>
      <span><b>${d.ppl}</b> ${t('wPeople')}</span></div>`;

  $('#waves').innerHTML = `
    <div class="wave c"><div class="wnum">1</div><div class="when">${t('w1when')}</div><h3>${t('w1h')}</h3>
      ${stat(W[0])}<p>${t('w1p')}</p>
      <ul><li>${t('w1a')}</li><li>${t('w1b')}</li><li>${t('w1c')}</li></ul></div>
    <div class="wave w"><div class="wnum">2</div><div class="when">${t('w2when')}</div><h3>${t('w2h')}</h3>
      ${stat(W[1])}<p>${t('w2p')}</p>
      <ul><li>${t('w2a')}</li><li>${t('w2b')}</li><li>${t('w2c')}</li></ul></div>
    <div class="wave"><div class="wnum">3</div><div class="when">${t('w3when')}</div><h3>${t('w3h')}</h3>
      ${stat(W[2])}<p>${t('w3p')}</p>

  const tot = A.completed + A.inprog + A.enrolled;
  const pc = n => (n / tot * 100).toFixed(1) + '%';
  const cap = `
    <h3 style="margin-top:14px">${t('capH')}</h3>
    <div class="capbar">
      <div style="width:${pc(A.completed)};background:var(--good)">${A.completed}</div>
      <div style="width:${pc(A.inprog)};background:var(--warning)">${A.inprog}</div>
      <div style="width:${pc(A.enrolled)};background:var(--axis)">${A.enrolled}</div>
    </div>
    <div class="caplegend">
      <span><i style="background:var(--good)"></i>${t('capDone')} ${A.completed}</span>
      <span><i style="background:var(--warning)"></i>${t('capProg')} ${A.inprog}</span>
      <span><i style="background:var(--axis)"></i>${t('capNew')} ${A.enrolled}</span>
    </div>`;

  $('#asks').innerHTML = `
    <h2>${t('progH')}</h2>
    <p class="lede">${t('progL')}</p>
    <div class="note g"><h3>${t('prog1H')}</h3><p>${t('prog1')}</p></div>
    <div class="note g"><h3>${t('prog2H')}</h3><p>${t('prog2')}</p></div>
    <div class="card"><h3 style="margin-top:0">${t('prog3H')}</h3><p>${t('prog3')}</p>
      <h3>${t('prog4H')}</h3><p>${t('prog4')}</p></div>
    <div class="note w"><h3>${t('demoH')}</h3><p>${t('demoP')}</p><ul>${t('demoL')}</ul><p style="margin-top:10px">${t('demoP2')}</p></div>
    <h2 style="margin-top:28px">${t('motionH')}</h2>
    <div class="card"><p>${t('motionP')}</p>${cap}</div>
    <div class="note"><h3>${t('motion1H')}</h3><ul><li>${t('motion1')}</li><li>${t('motion2')}</li></ul></div>
    <h2 style="margin-top:28px">${t('asksH')}</h2>
    <div class="card"><ul class="asks">
      <li><span class="who">${t('whoIcaro')}</span><span class="box"></span><span>${t('ask1')}</span></li>
      <li><span class="who">${t('whoIcaro')}</span><span class="box"></span><span>${t('ask2')}</span></li>
      <li><span class="who">${t('whoBoth')}</span><span class="box"></span><span>${t('ask3')}</span></li>
      <li><span class="who">${t('whoIcaro')}</span><span class="box"></span><span>${t('ask4')}</span></li>
      <li><span class="who">${t('whoIcaro')}</span><span class="box"></span><span>${t('ask5')}</span></li>
    </ul></div>
    <div class="note"><h3>${t('contactH')}</h3><p>${t('contactP')}</p></div>`;
}

/* ---------- headers for list tabs ---------- */
function buildListHeads(){
  // preserve current selections across an innerHTML rebuild
  const keep = {rf: $('#rf').value, cw: $('#cw').value, cl: $('#cl').value};
  $('#rf').innerHTML = `<option value="all">${t('rfAll')}</option>`
    + [0,1,2,3].map(i => `<option value="${i}">${t('rf'+i)}</option>`).join('')
    + `<option value="bench">${t('rfBench')}</option>`;
  $('#cw').innerHTML = `<option value="all">${t('cwAll')}</option>`
    + ['00','01','02','03','04','05'].map(w => `<option value="${w}">${t('w'+w)}</option>`).join('');
  $('#cl').innerHTML = `<option value="all">${t('clAll')}</option><option value="BCP">BCP</option><option value="BCA">BCA</option>`;
  if (keep.rf) $('#rf').value = keep.rf;
  if (keep.cw) $('#cw').value = keep.cw;
  if (keep.cl) $('#cl').value = keep.cl;

  const isBench = $('#rf').value === 'bench';
  $('#rosterHead').innerHTML = `<h2>${t('rosterH')}</h2><p class="lede">${t('rosterL')}</p>`
    + `<p class="hint">${t('clickHint')}</p>`
    + (isBench ? `<div class="note"><p>${t('benchNote',{n:BENCH.length})}</p></div>`
               : `<div class="note w"><h3>${t('rosterFixH')}</h3><p>${t('rosterFixP')}</p></div>`);
  $('#certsHead').innerHTML = `<h2>${t('certsH')}</h2><p class="lede">${t('certsL')}</p><p class="hint">${t('clickHintC')}</p>`;
  $('#rq').placeholder = t('rq');
  $('#cq').placeholder = t('cq');
}

/* ---------- static + language ---------- */
function applyStatic(){
  document.documentElement.setAttribute('lang', L === 'pt' ? 'pt-BR' : 'en');
  $$('[data-t]').forEach(el => { el.innerHTML = t(el.getAttribute('data-t')); });
}
function setLang(x){
  L = x;
  $('#langEn').setAttribute('aria-pressed', String(x === 'en'));
  $('#langPt').setAttribute('aria-pressed', String(x === 'pt'));
  applyStatic();
  themeBtn.textContent = curTheme() === 'dark' ? t('light') : t('dark');

}
$('#langEn').onclick = () => setLang('en');
$('#langPt').onclick = () => setLang('pt');

let rz; window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { drawCurve(); buildPlan(); }, 180); });

setLang('en');
ready = true;
