Object.assign(I.en, {"tabCall": "Open items", "h1": "Soluciones en TI 2009 — Education &amp; Certification Review", "sub": "Where every certification stands as of 27 August 2026, which ones lapse before you can staff the next project, and how to change the learning roster in one email. Seven reached their renewal date on 27 and 28 August. The operational detail sits behind each tab.", "execKicker": "Executive summary · 27 August 2026", "execH": "Seven certifications lapse in the next two days, and Service Management coverage reaches zero after March 2027.", "execLede": "STI holds {tot} certification records across {ppl} certified consultants, {act} of them active and {exp} already lapsed. {pct}% of every course the team enrolls in gets finished. The depth is real. The exposure is the concentration of renewal dates: {f27} of the {act} active certifications lapse before 31 March 2027, and only {v} run into FY28.", "execGoodH": "What is working", "execGapH": "Where the exposure is", "execG1": "{pct}% course completion across {n} enrollments, with {done} finished.", "execG2": "{bcp} Professional-level certifications live, held by {p} consultants.", "execG3": "Discovery, Operations Management, Client Management and CMDB are all covered into 2028 — {v} certifications run past FY27.", "execP1": "Seven certifications lapse on 27 and 28 August, including Yelitza Viloria&rsquo;s Digital Workplace Catalog credential.", "execP2": "{f} certifications across {p} consultants lapse before 31 March 2027 — {pct}% of everything active.", "execP3": "{z} product lines fall to zero certified consultants after FY27: {names}.", "execP4": "Six certifications have already lapsed — three for Roxenis Sanoja in mid-August and two for Rafael Obregón on 25 August.", "tiles": [["Consultants with learning activity", "Soluciones en TI 2009 C.A. · Venezuela"], ["Course enrollments", "221 distinct courses"], ["Completed", "{pct}% of all enrollments"], ["Still open", "{ip} in progress · {ns} not started"], ["Certifications on record", "{bca} BCA · {bcp} BCP · held by {ch} people"], ["Lapsing in FY27", "{f27bca} BCA · {f27bcp} BCP · {p} consultants"]], "revH": "Three certifications expire today, 27 August. Four more expire tomorrow.", "revP": "<b>Today, 27 August:</b> Evelin Pabón (AR System 22.x), Rafael Obregón (AR System 22.x), Rafael Obregón (Helix ITSM 22.x).<br><b>Tomorrow, 28 August:</b> Evelin Pabón (Helix ITSM 22.x), and Natasha Oliveros, Naylin García and Yelitza Viloria, all Digital Workplace 22.x for Catalog Administrators.<br><br>Six have already lapsed: Roxenis Sanoja lost three between 14 and 21 August, Rafael Obregón lost both Digital Workplace credentials on 25 August, and Juan Ramos&rsquo;s Operations Management credential expired in May 2025.", "entList": ["STI is <b>Premier</b>, which carries an FY27 entitlement of <b>up to 30 individuals</b> — and the record shows <b>zero of those thirty used</b>.", "Technical education and certification for STI&rsquo;s own consultants comes at <b>no cost</b> under the Partner Success program.", "<b>Bootcamps are included</b> in that entitlement.", "That covers the renewals in this review, the Professional-level upgrades, and the Portfolio Management path.", "None of it needs to sit inside a customer proposal or a services credit pool."], "footer": "Prepared for Soluciones en TI 2009 by Partner Success, Learning @ Helix · Snapshot as of 27 August 2026 · Source: NS Partners Course Progress FY27 and All Partners All Certifications exports, filtered to the Soluciones en TI 2009 branches · Pricing figures and commercial detail are shared by email rather than published here. Please treat this page as internal to STI and Helix.", "callBody": "\n<div class=\"card card-pad section\">\n<h2 style=\"margin-top:0\">How to use this page</h2>\n<p>This tab tracks everything left open after the 27 August call. Each item is either a decision needed from STI, an\nanswer owed by Helix, or context for both, and it is updated as things move. The other tabs hold the underlying data: the\n<b>Consultant roster</b> lets you click any name to open that person's full course and certification history, the\n<b>Certifications</b> tab lists every credential with its renewal date, and the <b>Certified bench</b> tab shows how many\npeople are certified per product line today and after this fiscal year.</p>\n<p class=\"note\">Two pieces of vocabulary used throughout. <b>BCA</b> is BMC Certified Associate, the foundational\ncredential. <b>BCP</b> is BMC Certified Professional, the higher tier and the scarcer one. Both count toward STI's\npartner accreditation. Every certification runs for two years from the date it was issued, and a lapsed credential stops\ncounting on the day it expires, not at the end of the year.</p>\n</div>\n\n<div class=\"card card-pad section\" style=\"border-left:3px solid var(--critical)\">\n<h2 style=\"margin-top:0\">What is still open</h2>\n<p class=\"note\" style=\"margin-top:0\">Where things stand after the 27 August call, and what each side is carrying.\nEverything below is tracked here and will be updated as it moves.</p>\n\n<h3 style=\"margin-bottom:2px\">What Helix owes STI</h3>\n<ol class=\"steps\">\n<li><b>The LA South education price list, in writing.</b> The Dominican Republic and Venezuela sit in the same pricing\nband, so one sheet covers both markets. Full figures are in the customer proposal section of this page.\n<br><span class=\"note\">Owner: Helix · By 28 August</span></li>\n\n<li><b>An answer on Using-level course access under the Enterprise subscription.</b> The FY27 price list does not state\nwhether Using-level courses reach every user at a customer or only named learners, so this has been escalated to Helix\nEducation rather than answered from the price list. It should not affect pricing, only how the access is described to\nthe client. Worth holding that specific point until the answer lands.\n<br><span class=\"note\">Owner: Helix · Escalated 27 August</span></li>\n\n<li><b>Portfolio Management course format and release date.</b> Luis Corona has confirmed the first web-based course\nreleases at the end of September. The exact course name and delivery format are being confirmed with him.\n<br><span class=\"note\">Owner: Helix · By 1 September</span></li>\n\n<li><b>A push for dedicated Portfolio Management sessions.</b> Rather than waiting on a single self-paced release, Helix\nis asking the education and bootcamp teams for two or three sessions, and arranging a test environment to record a\nsolution demo for the STI team in the meantime.\n<br><span class=\"note\">Owner: Helix · September</span></li>\n\n<li><b>Registration of the client and engagement statuses</b> once STI sends the validated list, so the records are\ncurrent while the new Partner Hub is being completed.\n<br><span class=\"note\">Owner: Helix, on receipt</span></li>\n</ol>\n\n<h3 style=\"margin-bottom:2px\">What Helix needs from STI</h3>\n<ol class=\"steps\">\n<li><b>A date to schedule the renewal batch.</b> The timing is tighter than a March horizon. Three certifications\nreached their renewal date on <b>27 August</b> and four more on <b>28 August</b>, because recertification has to be\nbooked and passed <em>before</em> the expiry date rather than after it.\n<br>The efficient part: Natasha Oliveros, Naylin García and Yelitza Viloria hold an identical set of four, so that is\ntwelve certificates in one scheduling conversation, at no cost under the Premier entitlement. The renewals tab lists\nevery date.\n<br><span class=\"note\">Owner: STI · Coordinators are validating the list, which is the right first step</span></li>\n\n<li><b>A decision on Roxenis Sanoja and Rafael Obregón.</b> Both have credentials that have already lapsed, three of\nRoxenis's in mid-August and two of Rafael's on 25 August. The choice is whether to reinstate the same version or move\nthem to the newer one, which carries two years rather than a few months.\n<br><span class=\"note\">Owner: STI</span></li>\n\n<li><b>Participant names for the bootcamps.</b> HelixGPT moves from self-paced to instructor-led delivery on\n<b>1 October</b>, so the flexible route closes soon. Evelin Pabón and Deiry Arias are furthest along on HelixGPT\nalready, with Deiry currently sitting the Certified Associate exam. Provisional names are enough to hold seats and can\nbe adjusted afterward.\n<br><span class=\"note\">Owner: STI · Before 1 October</span></li>\n\n<li><b>Confirmation of the Portfolio Management names.</b> Natasha and Yelitza were named on the call, pending internal\nconfirmation. Since the course does not release until end of September, the useful step now is starting them on\n<b>Innovation Studio</b>, which is the platform Portfolio Management is built on and is available today.\n<br><span class=\"note\">Owner: STI</span></li>\n\n<li><b>The validated client and engagement list</b>, once reviewed with Alicia, so the open and closed statuses can be\nbrought up to date.\n<br><span class=\"note\">Owner: STI</span></li>\n</ol>\n</div>\n\n<div class=\"card card-pad section\" style=\"border-left:3px solid var(--critical)\">\n<h2 style=\"margin-top:0\">Before promising anything on the Dominican track</h2>\n<p class=\"note\" style=\"margin-top:0\">Everything currently in play, sorted by how solid the evidence is. Say the green\nrows out loud. Frame the amber rows as being confirmed. Do not state the red rows at all.</p>\n\n<h3 style=\"margin-bottom:2px\">Confirmed, safe to state</h3>\n<div class=\"scroll\"><table style=\"table-layout:auto\">\n<thead><tr><th class=\"nosort\">Statement</th><th class=\"nosort\">Source</th></tr></thead><tbody>\n<tr><td>STI is a Partner Success partner at Premier level, with an FY27 entitlement of up to 30 individuals and zero used.</td><td>Partner record, 27 Aug</td></tr>\n<tr><td>Technical education and certification for STI's own consultants comes at no cost under the Partner Success program.</td><td>Program terms, restated by Gregorio 25 Aug</td></tr>\n<tr><td>Services credits fund the end customer's deliverable, not partner enablement.</td><td>Alejandra Corona, 25 Aug</td></tr>\n<tr><td>The first Portfolio Management WBT releases <b>end of September 2026</b>. Nothing is enrollable before then.</td><td>Luis Corona, Helix Education, 27 Aug</td></tr>\n<tr><td>Portfolio Management is built on Helix Innovation Studio, so the Innovation Studio course is a valid interim path.</td><td>STI, confirmed on the 27 Aug call</td></tr>\n<tr><td>STI holds zero Portfolio Management certifications and zero Portfolio Management course records.</td><td>Certification and course extracts, 27 Aug</td></tr>\n<tr><td>Every certification date in this review, including the 27 and 28 August expiries.</td><td>Certification extract, 27 Aug</td></tr>\n<tr><td>An FY27 Education Services price list exists, dated 28 May 2026.</td><td>CEL SharePoint</td></tr>\n<tr><td><b>The Dominican Republic is in LA South, which is the Emerging tier, Group 4, priced in USD.</b></td><td>FY27 price list, regional tier row</td></tr>\n<tr><td><b>The proposal used the Premium tier rather than LA South.</b> Corrected figures were sent to STI by email.</td><td>FY27 price list, LA South column</td></tr>\n<tr><td>Education subscriptions are scoped per product pillar, both individual and enterprise.</td><td>FY27 price list section headings</td></tr>\n<tr><td>Education subscription list prices vary by regional pricing group.</td><td>Helix Learning Subscriptions page, Feb 2026</td></tr>\n</tbody></table></div>\n\n<h3 style=\"margin-bottom:2px\">Reasoned but not verified, frame as being confirmed</h3>\n<div class=\"scroll\"><table style=\"table-layout:auto\">\n<thead><tr><th class=\"nosort\">Working read</th><th class=\"nosort\">Why it is not yet certain</th></tr></thead><tbody>\n<tr><td>A subscription bought for one product pillar would not unlock another pillar's course content.</td><td>The workbook scopes subscriptions \"per person/product pillar\" and \"per company/product pillar\", which supports this, but it contains no cross-pillar entitlement matrix stating it outright.</td></tr>\n<tr><td>Using-level WBTs would not be free for all of a customer's users under the quoted Individual subscriptions.</td><td>The FY27 price list has now been read and contains no entitlement sentence either way. Supported by the per-person pillar scoping, but not stated. Needs Helix Education to confirm.</td></tr>\n<tr><td>A Portfolio Management certification exam may not exist at launch.</td><td>None appears on the FY26 roadmap while every other line lists theirs. The product is newly acquired and the curriculum is still being built, so this is genuinely undecided rather than settled.</td></tr>\n</tbody></table></div>\n\n<h3 style=\"margin-bottom:2px\">Unknown, do not state</h3>\n<div class=\"scroll\"><table style=\"table-layout:auto\">\n<thead><tr><th class=\"nosort\">Open question</th><th class=\"nosort\">Who can close it</th></tr></thead><tbody>\n<tr><td>Whether Portfolio Management training is covered by the Partner Success education subscription specifically, rather than generally.</td><td>Helix Learning</td></tr>\n<tr><td>Delivery format, scheduled sessions and curriculum owner for the Portfolio Management course.</td><td>Helix Learning</td></tr>\n<tr><td>Whether STI's partner authorization letter covers resale of education services.</td><td>STI, and the channel team</td></tr>\n<tr><td>Final credit count, tax withholding treatment and any additional credits on the eTech services quote.</td><td>Alejandra Corona</td></tr>\n<tr><td>Whether the customer course proposal has already been submitted, and whether its two customers are the same two Dominican tenders Alicia mentioned.</td><td>Yelitza, on this call</td></tr>\n</tbody></table></div>\n\n<p style=\"margin-top:14px\"><b>The safe formulation for anything in the amber or red tables:</b> \"That is what I expect, and\nI am confirming it in writing before you use it.\" It costs nothing and it protects both sides.</p>\n</div>\n\n<div class=\"card card-pad section\">\n<h2 style=\"margin-top:0\">Bootcamps: what they are and what is outstanding</h2>\n\n<h3 style=\"margin-bottom:2px\">What these are</h3>\n<p>Two scheduled, instructor-led group sessions, not self-paced courses. <b>HelixGPT</b> covers the Helix AI layer.\n<b>Agent Creation</b> covers building AI agents on top of it. The agreed order is HelixGPT first, then Agent Creation,\nbecause the second assumes the first. Each attendee gets a hands-on environment, which is why seats are capped.</p>\n\n<h3 style=\"margin-bottom:2px\">The process agreed on 22 July</h3>\n<p>Three steps. Helix sends the dates. STI confirms which sessions apply to which people. Helix registers them. Step one\nclosed on <b>30 July</b> with the four-PDF content pack, the schedule and a provisional calendar link. Step two, the\nnames, has not come back yet, so step three has not happened.</p>\n\n<h3 style=\"margin-bottom:2px\">Why the timing matters now</h3>\n<p>The <b>Agent Creation session is 28 August</b> and is capped at 20 hands-on environments across all partners, not 20\nreserved for STI. Separately, <b>HelixGPT moves to instructor-led delivery on 1 October</b>, which closes the self-paced\nroute people can start at any time and replaces it with scheduled classes.</p>\n\n<h3 style=\"margin-bottom:2px\">STI is not starting from zero</h3>\n<p>Four consultants have already completed Helix technical bootcamps: <b>Juan Ramos, Yelitza Viloria, Natasha Oliveros\nand Rafael Obregón</b> all finished the ITSM/ITOM Container bootcamp — Yelitza and Natasha in the same November 2025 session. Juan also completed\nAdvanced AIOps and the Solution Demo bootcamp. The format is familiar.</p>\n<p>More useful still, two people are already well into HelixGPT on their own. <b>Evelin Pabón</b> has nine HelixGPT course\nrecords with five completed between March and July 2026, covering Employee Navigator, Service Collaborator, Insight\nFinder, Ops Swarmer and Service Catalog Curator. <b>Deiry Arias</b> has seven, and is currently sitting the\n<b>BMC Certified Associate: HelixGPT 23.x for Users</b> exam.</p>\n\n<h3 style=\"margin-bottom:2px\">The recommendation</h3>\n<p>Put <b>Evelin and Deiry</b> into the HelixGPT session first. They have done the groundwork and one is already taking\nthe exam, so the seat converts into something. Víctor Touza has the most free capacity of anyone on the roster, but no\nHelixGPT exposure at all, so he is the better fit for the Portfolio Management path than for this bootcamp.</p>\n<p>If a wider list is wanted, the roster STI shared on <b>29 July</b> named Arturo Martínez, Yelitza Viloria, Natasha\nOliveros, Evelin Pabón, Roxenis Sanoja, Rafael Obregón, Deiry Arias and Alicia Salazar, plus monitoring and observability\nconsultants. Provisional names are enough to hold seats and can be adjusted afterward.</p>\n\n<p class=\"note\">Data note: several bootcamp records carry an enrollment date of 17 June 2026 with completion dates in\n2023 to 2025, so completed before enrolled. That is an artifact of the Docebo platform migration. The completions are\nreal, the enrollment dates are not.</p>\n\n<p class=\"note\">Data note, corrected 1 September 2026: an earlier version of this page said Yelitza Viloria and Natasha Oliveros completed the ITSM/ITOM Container bootcamp twice. They did not — each completed it once, on 7 November 2025. The same bootcamp appears in the platform under two catalogue titles, one of them suffixed <b>v.HS-Y</b>, because bootcamps that are republished as learning-platform courses acquire a second course code. One attendance, two records. Corrected after Yelitza flagged it.\n</div>\n\n<div class=\"card card-pad section\" style=\"border-left:3px solid var(--warning)\">\n<h2 style=\"margin-top:0\">Portfolio Management: where the training actually stands</h2>\n<p class=\"note\" style=\"margin-top:0\">Updated 27 August after the cadence call. The authoritative answer came from\n<b>Luis Corona, Helix Education</b>, and it corrects an earlier reading of the FY26 learning roadmap.</p>\n\n<h3 style=\"margin-bottom:2px\">The course is not available yet</h3>\n<p>The FY26 Helix Learning Roadmap lists <b>BMC Helix Portfolio Management 25.x: Fundamentals Using</b> under Enterprise\nService Management. That roadmap is a forecast of what is coming, not a catalog of what is live.</p>\n<p><b>Luis Corona confirmed the first Portfolio Management WBT releases at the end of September 2026.</b> Nothing is\nenrollable before then, which matches what STI found when they searched the platform and came up empty.</p>\n<p class=\"note\">Correction: an earlier version of this page said the course could start immediately. That was drawn from\nthe roadmap listing and was wrong. Education holds the release schedule and Education says end of September.</p>\n\n<h3 style=\"margin-bottom:2px\">What is confirmed regardless of format</h3>\n<p>Whatever the delivery format turns out to be, including instructor-led, <b>it is covered at no cost</b> under the\nPartner Success entitlement. STI is Premier with an FY27 allowance of up to 30 individuals and zero used. It does not\nbelong inside a customer proposal or a services credit pool, and services credits are a separate pool from education\nin any case.</p>\n\n<h3 style=\"margin-bottom:2px\">Still unconfirmed</h3>\n<ul style=\"margin:4px 0 0;padding-left:18px\">\n<li><b>Delivery format.</b> Web-based, instructor-led or self-paced is not yet settled. Confirmation pending from Luis Corona.</li>\n<li><b>Whether a certification exam will exist.</b> No Associate or Professional exam for Portfolio Management appears\nanywhere on the FY26 roadmap, while every other product line lists its exams explicitly. Since the product is newly\nacquired and the curriculum is still being built, absence today does not settle the question.</li>\n<li><b>Curriculum owner</b> for the Portfolio Management learning path.</li>\n</ul>\n\n<h3 style=\"margin-bottom:2px\">The interim path, and it is a good one</h3>\n<p>Portfolio Management is built on <b>BMC Helix Innovation Studio</b>. Yelitza worked this out independently and is\ntaking the Innovation Studio course while waiting for the Portfolio Management release. That is the right bridge: it is\navailable now, it is the underlying platform, and it will shorten the Portfolio Management path when it opens.</p>\n<p>Recommend the same route to anyone else STI wants ready for this line.</p>\n\n<h3 style=\"margin-bottom:2px\">Named for the path</h3>\n<p><b>Natasha Oliveros and Yelitza Viloria</b>, per STI on the 27 August call, subject to Yelitza confirming internally.\nTwo more with genuine capacity if the group widens: <b>Víctor Touza</b>, who carries no renewals at all this year, and\n<b>Deiry Arias</b>, who has nothing due before March 2027.</p>\n\n<h3 style=\"margin-bottom:2px\">What Helix committed to on the call</h3>\n<ul style=\"margin:4px 0 0;padding-left:18px\">\n<li>Confirm the exact course name, format and release date with Luis Corona.</li>\n<li>Escalate the demand internally, including to the bootcamp and education teams, and push for two or three\nPortfolio Management sessions rather than waiting for a single self-paced release.</li>\n<li>Record a Portfolio Management solution demo for STI once a test environment is available.</li>\n<li>Connect with the instructors already working on this product line.</li>\n<li>Update this page as each piece lands.</li>\n</ul>\n</div>\n\n<div class=\"card card-pad section\">\n<h2 style=\"margin-top:0\">What Helix Portfolio Management actually does</h2>\n<p class=\"note\" style=\"margin-top:0\">Useful shorthand if the capability comes up on the call.</p>\n<p>Six connected areas: <b>Idea and request</b> intake, fully integrated with Digital Workplace. <b>Demand management</b>\ncovering forecasting, planning and prioritization for the PMO. <b>Project management</b> supporting Agile, Waterfall or a\nmix. <b>Portfolio management</b> giving a 360 degree view across IT and line of business. <b>Resource management</b>\ncovering capacity, utilization and competency. <b>Financial management</b> with fiscal years, periods, multi currency and\nsimulation.</p>\n<p>The point that connects it to what STI already delivers: portfolio decisions are linked to real project activity and\nto the underlying service and operations data, rather than sitting in a separate planning tool.</p>\n</div>\n\n<div class=\"card card-pad section\" style=\"border-left:3px solid var(--good-ink)\">\n<h2 style=\"margin-top:0\">Platform access — resolved, and how it actually works</h2>\n<p><b>Daviuska Viloria is sorted.</b> The license was assigned on 23 July, and the learning record now shows her with an\nactive course in progress and a last platform access of 10 August. The issue reported on 16 July is closed.</p>\n<p>Worth knowing for next time: adding a consultant to the Partner Success Subscription Group does <b>not</b> by itself\ngrant access to the content. A subscription license has to be assigned separately. If someone logs in and sees courses\npriced for payment, that is almost always an incomplete license assignment rather than a pricing question.</p>\n</div>\n\n<div class=\"card card-pad section\">\n<h2 style=\"margin-top:0\">The customer course proposal — <em>Validación de Propuesta Cursos para cliente</em></h2>\n\n<p class=\"note\" style=\"margin-top:0\">Background: on 10 and 11 August Yelitza sent a priced course proposal for two Dominican Republic customers, under the subject <em>Validación de Propuesta Cursos para cliente</em>, asking Helix to validate the figures and answer one question about what a subscription includes. These are the answers.</p>\n<h3 style=\"margin-bottom:2px\">1. The pricing tier</h3>\n<p>Education Services prices by regional tier, and the tier applied in the proposal was the one used for the United\nStates, the United Kingdom, Denmark and Switzerland. <b>The Dominican Republic and Venezuela both sit in the LA South\nband</b>, which is a materially lower tier and is quoted in US dollars, so one set of figures serves both markets.</p>\n<p>Correcting the tier brings the proposal down, not up, which makes it more competitive rather than less.</p>\n<p><b>The full LA South figures were sent to Yelitza by email on 28 August</b>, covering subscriptions, certification\nexams, public instructor-led training and private course day rates. They are not reproduced on this page.</p>\n\n<h3 style=\"margin-bottom:2px\">2. Subscriptions are scoped per product pillar</h3>\n<p>The workbook headings are explicit: <b>\"Individual Education Subscriptions (per person/product pillar)\"</b> and\n<b>\"Enterprise Subscriptions for Customers (per company/product pillar)\"</b>. So a subscription covers one pillar, not\nthe whole catalog.</p>\n<p>That matters because the course list in the proposal spans six pillars: Helix ITSM, Digital Workplace, Innovation\nStudio, Business Workflows, Dashboards and CMDB. Two individual subscriptions will not cover all of them. Worth working\nthrough together which pillars the customer actually needs.</p>\n<p class=\"note\">Correction to an earlier read: the workbook does <em>not</em> list separate Operations Management and\nService Management variants of the web-based enterprise subscription. There is one generic line.\nThe pillar-specific enterprise subscriptions are priced as a percentage of the product spend instead, listed separately.</p>\n\n<h3 style=\"margin-bottom:2px\">3. The WBT question is still open</h3>\n<p>The price list carries a line for web-based content under the heading \"Web Based Courses, all Helix products\".\nIt does <b>not</b> state whether Using-level or Fundamentals-level WBTs are included for all of a\ncustomer's users under any subscription, nor that they are restricted to named learners. The only scope wording is the\nper-person and per-company pillar language above.</p>\n<p>So the honest answer to the customer is that the individual subscriptions are per person and per pillar, and that the\ncompany-wide question is being confirmed with Helix Education rather than inferred from the price list.</p>\n\n<h3 style=\"margin-bottom:2px\">4. Options that may fit better</h3>\n<p>For a large account, the per-product <b>Education Enterprise Subscription</b> is priced as a percentage of what the\ncustomer spends on that product rather than per person. For a client the size of a bank that can work out better than\nadding up individual subscriptions across six pillars. Both shapes can be modeled on request.</p>\n<p>The emailed price sheet also covers certification exams, public instructor-led day rates, private online and onsite\ncourse rates, and the partner-only essential subscription, so the offer can be shaped without going back to the list\neach time.</p>\n\n<h3 style=\"margin-bottom:2px\">5. Authorization to resell education services</h3>\n<p>Selling Helix education services into an end customer normally needs that capability recognized in writing in the\npartner authorization letter. It has been requested explicitly for another Partner Success partner in a recent tender.\nWorth confirming STI holds the same language before a training proposal goes into a bid.</p>\n</div>\n\n<div class=\"card card-pad section\" style=\"border-left:3px solid var(--brand)\">\n<h2 style=\"margin-top:0\">Why the renewal dates matter beyond the certificates</h2>\n<p>STI holds Premier standing across delivery and sales, with an FY27 record of every registered engagement completed\nsuccessfully. That standing rests in part on certified coverage per product line.</p>\n<p>The connection worth making: the flagship delivery work runs on <b>Helix ITSM</b> and <b>Discovery</b>. Discovery is\ncovered into 2028. <b>Helix ITSM coverage reaches zero after March 2027</b> if nothing is renewed, and so does AR System.\nThe renewals are not administrative housekeeping, they are what keeps the team certified on the product lines the\ndelivery practice is built on.</p>\n<p>Two smaller items also feed the tier position rather than delivery: customer satisfaction surveys have not yet been\nactivated for any engagement, and several engagement records still show as active with end dates that have passed. Both\nare quick to fix and both are visible at tier review.</p>\n</div>\n\n<div class=\"card card-pad section\">\n<h2 style=\"margin-top:0\">Who owes what</h2>\n<table style=\"table-layout:auto\">\n<thead><tr><th class=\"nosort\">Action</th><th class=\"nosort\">Owner</th><th class=\"nosort\">By</th></tr></thead>\n<tbody>\n<tr><td>Book the Natasha / Naylin / Yelitza renewal batch, twelve certificates</td><td>Helix + STI</td><td>this week</td></tr>\n<tr><td>Decide Roxenis and Rafael — reinstate or move to the newer version</td><td>STI</td><td>this week</td></tr>\n<tr><td>Provisional participant names for HelixGPT and Agent Creation</td><td>Yelitza</td><td>27 Aug</td></tr>\n<tr><td>Confirm the Portfolio Management names, and start them on Innovation Studio in the meantime</td><td>Yelitza</td><td>next week</td></tr>\n<tr><td>Confirm course format and release date with Luis Corona, Helix Education</td><td>Helix</td><td>1 Sep</td></tr>\n<tr><td>Push the education and bootcamp teams for two or three Portfolio Management sessions</td><td>Helix</td><td>September</td></tr>\n<tr><td>Record a Portfolio Management solution demo once a test environment is available</td><td>Helix</td><td>September</td></tr>\n<tr><td>Send the full LA South price sheet in writing, same tier as Venezuela</td><td>Helix</td><td>28 Aug</td></tr>\n<tr><td>Confirm the WBT entitlement question against the FY27 price list, in writing</td><td>Helix</td><td>28 Aug</td></tr>\n<tr><td>Confirm which subscription variant the customer proposal should carry</td><td>Yelitza + Helix</td><td>28 Aug</td></tr>\n<tr><td>Check whether the authorization letter covers education services resale</td><td>STI</td><td>next week</td></tr>\n<tr><td>Plan the December cluster — Roxenis, Evelin, Rafael and Juan all renew that month</td><td>Helix + STI</td><td>October</td></tr>\n<tr><td>Decide the Juan Ramos Discovery 22.x to 24.x migration</td><td>STI</td><td>November</td></tr>\n<tr><td>Identify a second CMDB-certified engineer</td><td>STI</td><td>September</td></tr>\n</tbody></table>\n</div>\n"});
Object.assign(I.es, {"tabCall": "Pendientes", "h1": "Soluciones en TI 2009 — Revisión de Educación y Certificaciones", "sub": "Dónde está cada certificación al 27 de agosto de 2026, cuáles vencen antes de que puedas asignar el próximo proyecto, y cómo cambiar el roster de capacitación con un solo correo. Siete llegaron a su fecha de renovación el 27 y 28 de agosto. El detalle operativo está en cada pestaña.", "execKicker": "Resumen ejecutivo · 27 de agosto de 2026", "execH": "Siete certificaciones vencen en los próximos dos días, y la cobertura de Service Management llega a cero después de marzo de 2027.", "execLede": "STI tiene {tot} registros de certificación en {ppl} consultores certificados, {act} activas y {exp} ya vencidas. Se completa el {pct}% de los cursos en los que se inscribe el equipo. La profundidad técnica es real. El riesgo es la concentración de fechas de vencimiento: {f27} de las {act} activas vencen antes del 31 de marzo de 2027, y solo {v} llegan a FY28.", "execGoodH": "Lo que está funcionando", "execGapH": "Dónde está el riesgo", "execG1": "{pct}% de finalización de cursos sobre {n} inscripciones, con {done} completadas.", "execG2": "{bcp} certificaciones de nivel Professional vigentes, en manos de {p} consultores.", "execG3": "Discovery, Operations Management, Client Management y CMDB están cubiertos hasta 2028 — {v} certificaciones pasan de FY27.", "execP1": "Siete certificaciones vencen el 27 y 28 de agosto, incluida la credencial Digital Workplace Catalog de Yelitza Viloria.", "execP2": "{f} certificaciones en {p} consultores vencen antes del 31 de marzo de 2027 — el {pct}% de todo lo activo.", "execP3": "{z} líneas de producto quedan sin ningún consultor certificado después de FY27: {names}.", "execP4": "Seis certificaciones ya vencieron — tres de Roxenis Sanoja a mediados de agosto y dos de Rafael Obregón el 25 de agosto.", "tiles": [["Consultores con actividad de aprendizaje", "Soluciones en TI 2009 C.A. · Venezuela"], ["Inscripciones a cursos", "221 cursos distintos"], ["Completados", "{pct}% de todas las inscripciones"], ["Aún abiertos", "{ip} en progreso · {ns} sin iniciar"], ["Certificaciones registradas", "{bca} BCA · {bcp} BCP · en {ch} personas"], ["Vencen en FY27", "{f27bca} BCA · {f27bcp} BCP · {p} consultores"]], "revH": "Tres certificaciones vencen hoy, 27 de agosto. Cuatro más vencen mañana.", "revP": "<b>Hoy, 27 de agosto:</b> Evelin Pabón (AR System 22.x), Rafael Obregón (AR System 22.x), Rafael Obregón (Helix ITSM 22.x).<br><b>Mañana, 28 de agosto:</b> Evelin Pabón (Helix ITSM 22.x), y Natasha Oliveros, Naylin García y Yelitza Viloria, las tres en Digital Workplace 22.x for Catalog Administrators.<br><br>Seis ya vencieron: Roxenis Sanoja perdió tres entre el 14 y el 21 de agosto, Rafael Obregón perdió sus dos credenciales de Digital Workplace el 25 de agosto, y la credencial de Operations Management de Juan Ramos venció en mayo de 2025.", "entList": ["STI es <b>Premier</b>, lo que da una asignación FY27 de <b>hasta 30 personas</b> — y el registro muestra <b>cero de esas treinta utilizadas</b>.", "La educación técnica y las certificaciones para los consultores de STI son <b>sin costo</b> dentro del programa Partner Success.", "Los <b>bootcamps están incluidos</b> en esa asignación.", "Eso cubre las renovaciones de esta revisión, las subidas a nivel Professional y la ruta de Portfolio Management.", "Nada de eso tiene que ir dentro de una propuesta a cliente ni de una bolsa de créditos de servicios."], "footer": "Preparado para Soluciones en TI 2009 por Partner Success, Learning @ Helix · Corte al 27 de agosto de 2026 · Fuente: exportaciones NS Partners Course Progress FY27 y All Partners All Certifications, filtradas a las sucursales de Soluciones en TI 2009 · Las cifras de precios y el detalle comercial se comparten por correo y no se publican aquí. Por favor traten esta página como interna de STI y Helix.", "callBody": "\n<div class=\"card card-pad section\">\n<h2 style=\"margin-top:0\">Cómo usar esta página</h2>\n<p>Esta pestaña lleva el seguimiento de todo lo que quedó abierto después de la llamada del 27 de agosto. Cada punto es\nuna decisión que necesitamos de STI, una respuesta que debe Helix, o contexto para ambas partes, y se actualiza conforme\navanzan los temas. Las demás pestañas\ntienen los datos de fondo: en <b>Consultores</b> puedes hacer clic en cualquier nombre para abrir su historial completo\nde cursos y certificaciones, la pestaña de <b>Certificaciones</b> lista cada credencial con su fecha de renovación, y\n<b>Cobertura</b> muestra cuántas personas están certificadas por línea de producto hoy y después de este año fiscal.</p>\n<p class=\"note\">Dos términos que se usan en toda la página. <b>BCA</b> es BMC Certified Associate, la credencial base.\n<b>BCP</b> es BMC Certified Professional, el nivel superior y el más escaso. Ambos cuentan para la acreditación de STI\ncomo partner. Cada certificación dura dos años desde la fecha de emisión, y una credencial vencida deja de contar el\nmismo día en que vence, no al final del año.</p>\n</div>\n\n<div class=\"card card-pad section\" style=\"border-left:3px solid var(--critical)\">\n<h2 style=\"margin-top:0\">Lo que sigue abierto</h2>\n<p class=\"note\" style=\"margin-top:0\">Cómo quedaron los temas después de la llamada del 27 de agosto, y qué lleva cada\nlado. Todo lo de abajo queda registrado aquí y se irá actualizando conforme avance.</p>\n\n<h3 style=\"margin-bottom:2px\">Lo que Helix le debe a STI</h3>\n<ol class=\"steps\">\n<li><b>La lista de precios de educación de LA South, por escrito.</b> República Dominicana y Venezuela están en la misma\nbanda de precios, así que una sola lista sirve para los dos mercados. Las cifras completas están en la sección de la\npropuesta de cursos de esta página.\n<br><span class=\"note\">Responsable: Helix · Para el 28 de agosto</span></li>\n\n<li><b>Una respuesta sobre el acceso a los cursos de nivel Using bajo la suscripción Enterprise.</b> La lista de precios\nFY27 no indica si los cursos Using llegan a todos los usuarios de un cliente o solo a personas nombradas, así que se\nescaló a Helix Education en lugar de deducirlo de la lista. No debería afectar el precio, solo cómo se describe el\nacceso al cliente. Conviene reservar ese punto específico hasta tener la respuesta.\n<br><span class=\"note\">Responsable: Helix · Escalado el 27 de agosto</span></li>\n\n<li><b>Modalidad y fecha de publicación del curso de Portfolio Management.</b> Luis Corona confirmó que el primer curso\nweb sale a finales de septiembre. Se está confirmando con él el nombre exacto y la modalidad.\n<br><span class=\"note\">Responsable: Helix · Para el 1 de septiembre</span></li>\n\n<li><b>Empujar sesiones dedicadas de Portfolio Management.</b> En lugar de esperar solo la publicación autogestionada,\nHelix está pidiendo a los equipos de educación y bootcamp dos o tres sesiones, y gestionando un ambiente de pruebas para\ngrabar un demo de solución para el equipo de STI mientras tanto.\n<br><span class=\"note\">Responsable: Helix · Septiembre</span></li>\n\n<li><b>Registrar los estatus de clientes y proyectos</b> en cuanto STI envíe la lista validada, para que los registros\nestén al día mientras se termina el nuevo Partner Hub.\n<br><span class=\"note\">Responsable: Helix, al recibirla</span></li>\n</ol>\n\n<h3 style=\"margin-bottom:2px\">Lo que Helix necesita de STI</h3>\n<ol class=\"steps\">\n<li><b>Una fecha para agendar el bloque de renovaciones.</b> Los tiempos son más ajustados que un horizonte a marzo.\nTres certificaciones llegaron a su fecha de renovación el <b>27 de agosto</b> y cuatro más el <b>28 de agosto</b>, porque\nla recertificación hay que agendarla y aprobarla <em>antes</em> de la fecha de vencimiento, no después.\n<br>La parte eficiente: Natasha Oliveros, Naylin García y Yelitza Viloria tienen el mismo conjunto de cuatro, así que\nson doce certificados en una sola gestión de agenda, sin costo dentro de la asignación Premier. La pestaña de\nrenovaciones tiene todas las fechas.\n<br><span class=\"note\">Responsable: STI · Los coordinadores ya están validando la lista, que es el primer paso correcto</span></li>\n\n<li><b>Una decisión sobre Roxenis Sanoja y Rafael Obregón.</b> Ambos tienen credenciales ya vencidas, tres de Roxenis a\nmediados de agosto y dos de Rafael el 25 de agosto. La decisión es si se reactiva la misma versión o se migran a la más\nnueva, que da dos años en lugar de unos meses.\n<br><span class=\"note\">Responsable: STI</span></li>\n\n<li><b>Nombres de participantes para los bootcamps.</b> HelixGPT pasa de autogestionado a modalidad con instructor el\n<b>1 de octubre</b>, así que la vía flexible se cierra pronto. Evelin Pabón y Deiry Arias son quienes más han avanzado en\nHelixGPT, y Deiry está presentando el examen de Certified Associate. Con nombres provisionales basta para reservar cupos\ny se ajustan después.\n<br><span class=\"note\">Responsable: STI · Antes del 1 de octubre</span></li>\n\n<li><b>Confirmación de los nombres para Portfolio Management.</b> En la llamada se mencionó a Natasha y a Yelitza, sujeto\na confirmación interna. Como el curso no se publica hasta finales de septiembre, el paso útil ahora es arrancarlas en\n<b>Innovation Studio</b>, que es la plataforma sobre la que está construido Portfolio Management y está disponible hoy.\n<br><span class=\"note\">Responsable: STI</span></li>\n\n<li><b>La lista validada de clientes y proyectos</b>, una vez revisada con Alicia, para poner al día los estatus\nabiertos y cerrados.\n<br><span class=\"note\">Responsable: STI</span></li>\n</ol>\n</div>\n\n<div class=\"card card-pad section\" style=\"border-left:3px solid var(--critical)\">\n<h2 style=\"margin-top:0\">Antes de prometer algo en el frente dominicano</h2>\n<p class=\"note\" style=\"margin-top:0\">Todo lo que está en juego hoy, ordenado por qué tan sólida es la evidencia. Lo\nverde se puede decir. Lo ámbar se plantea como algo que se está confirmando. Lo rojo no se dice.</p>\n\n<h3 style=\"margin-bottom:2px\">Confirmado, se puede decir</h3>\n<div class=\"scroll\"><table style=\"table-layout:auto\">\n<thead><tr><th class=\"nosort\">Afirmación</th><th class=\"nosort\">Fuente</th></tr></thead><tbody>\n<tr><td>STI es partner de Partner Success en nivel Premier, con una asignación FY27 de hasta 30 personas y cero utilizadas.</td><td>Registro de partner, 27 ago</td></tr>\n<tr><td>La educación técnica y las certificaciones para los consultores de STI son sin costo dentro del programa Partner Success.</td><td>Términos del programa, reiterado por Gregorio el 25 ago</td></tr>\n<tr><td>Los créditos de servicios financian el entregable del cliente final, no la habilitación del partner.</td><td>Alejandra Corona, 25 ago</td></tr>\n<tr><td>El primer WBT de Portfolio Management sale a <b>finales de septiembre de 2026</b>. Antes de esa fecha no hay nada en lo que inscribirse.</td><td>Luis Corona, Helix Education, 27 ago</td></tr>\n<tr><td>Portfolio Management está construido sobre Helix Innovation Studio, así que el curso de Innovation Studio es una ruta intermedia válida.</td><td>STI, confirmado en la llamada del 27 ago</td></tr>\n<tr><td>STI tiene cero certificaciones y cero registros de curso de Portfolio Management.</td><td>Extractos de certificaciones y cursos, 27 ago</td></tr>\n<tr><td>Todas las fechas de certificación de esta revisión, incluidos los vencimientos del 27 y 28 de agosto.</td><td>Extracto de certificaciones, 27 ago</td></tr>\n<tr><td>Existe una lista de precios FY27 de Education Services, con fecha 28 de mayo de 2026.</td><td>SharePoint CEL</td></tr>\n<tr><td><b>República Dominicana está en LA South, nivel Emerging, Grupo 4, cotizado en USD.</b></td><td>Lista FY27, fila de nivel regional</td></tr>\n<tr><td><b>La propuesta usó el nivel Premium en lugar de LA South.</b> Las cifras corregidas se enviaron a STI por correo.</td><td>Lista FY27, columna LA South</td></tr>\n<tr><td>Las suscripciones de educación se cotizan por pilar de producto, tanto individuales como enterprise.</td><td>Encabezados de sección de la lista FY27</td></tr>\n<tr><td>Los precios de lista de las suscripciones de educación varían por grupo regional.</td><td>Página de Helix Learning Subscriptions, feb 2026</td></tr>\n</tbody></table></div>\n\n<h3 style=\"margin-bottom:2px\">Razonado pero no verificado, plantear como en confirmación</h3>\n<div class=\"scroll\"><table style=\"table-layout:auto\">\n<thead><tr><th class=\"nosort\">Lectura de trabajo</th><th class=\"nosort\">Por qué todavía no es seguro</th></tr></thead><tbody>\n<tr><td>Una suscripción comprada para un pilar de producto no daría acceso al contenido de otro pilar.</td><td>La lista cotiza las suscripciones \"per person/product pillar\" y \"per company/product pillar\", lo que lo respalda, pero no incluye una matriz de entitlement entre pilares que lo diga de forma explícita.</td></tr>\n<tr><td>Los WBT de nivel Using no quedarían libres para todos los usuarios del cliente con las suscripciones Individual cotizadas.</td><td>Ya se leyó la lista de precios FY27 y no contiene ninguna frase de entitlement en ningún sentido. Lo respalda el alcance por persona y pilar, pero no está declarado. Falta que lo confirme Helix Education.</td></tr>\n<tr><td>Puede que no exista examen de certificación de Portfolio Management al momento del lanzamiento.</td><td>No aparece ninguno en el roadmap FY26 mientras todas las demás líneas listan los suyos. El producto es de adquisición reciente y el currículo se está construyendo, así que está genuinamente sin decidir.</td></tr>\n</tbody></table></div>\n\n<h3 style=\"margin-bottom:2px\">Desconocido, no decirlo</h3>\n<div class=\"scroll\"><table style=\"table-layout:auto\">\n<thead><tr><th class=\"nosort\">Pregunta abierta</th><th class=\"nosort\">Quién la cierra</th></tr></thead><tbody>\n<tr><td>Si la formación de Portfolio Management está cubierta específicamente por la suscripción de educación de Partner Success, y no solo en general.</td><td>Helix Learning</td></tr>\n<tr><td>Modalidad, sesiones programadas y responsable del currículo del curso de Portfolio Management.</td><td>Helix Learning</td></tr>\n<tr><td>Si la carta de autorización de partner de STI cubre la reventa de servicios de educación.</td><td>STI y el equipo de canal</td></tr>\n<tr><td>Conteo final de créditos, tratamiento de retención de impuestos y créditos adicionales en la cotización de servicios de eTech.</td><td>Alejandra Corona</td></tr>\n<tr><td>Si la propuesta de cursos al cliente ya fue entregada, y si sus dos clientes son las mismas dos licitaciones dominicanas que mencionó Alicia.</td><td>Yelitza, en esta llamada</td></tr>\n</tbody></table></div>\n\n<p style=\"margin-top:14px\"><b>La fórmula segura para todo lo ámbar o rojo:</b> \"Eso es lo que espero, y te lo confirmo por\nescrito antes de que lo uses.\" No cuesta nada y protege a ambas partes.</p>\n</div>\n\n<div class=\"card card-pad section\">\n<h2 style=\"margin-top:0\">Bootcamps: qué son y qué está pendiente</h2>\n\n<h3 style=\"margin-bottom:2px\">Qué son</h3>\n<p>Dos sesiones grupales programadas y con instructor, no cursos autogestionados. <b>HelixGPT</b> cubre la capa de IA de\nHelix. <b>Agent Creation</b> cubre la construcción de agentes de IA sobre esa capa. El orden acordado es HelixGPT primero\ny luego Agent Creation, porque el segundo asume el primero. Cada participante recibe un ambiente de práctica, y por eso\nlos cupos son limitados.</p>\n\n<h3 style=\"margin-bottom:2px\">El proceso acordado el 22 de julio</h3>\n<p>Tres pasos. Helix envía las fechas. STI confirma qué sesiones aplican y a quiénes. Helix los registra. El paso uno se\ncerró el <b>30 de julio</b> con el paquete de cuatro PDFs, el calendario y el enlace provisional. El paso dos, los\nnombres, todavía no ha vuelto, así que el paso tres no ha ocurrido.</p>\n\n<h3 style=\"margin-bottom:2px\">Por qué las fechas aprietan ahora</h3>\n<p>La <b>sesión de Agent Creation es el 28 de agosto</b> y tiene un tope de 20 ambientes de práctica para todos los\npartners, no 20 reservados para STI. Aparte, <b>HelixGPT pasa a modalidad con instructor el 1 de octubre</b>, lo que\ncierra la vía autogestionada que se puede empezar en cualquier momento y la reemplaza por clases programadas.</p>\n\n<h3 style=\"margin-bottom:2px\">STI no arranca de cero</h3>\n<p>Cuatro consultores ya completaron bootcamps técnicos de Helix: <b>Juan Ramos, Yelitza Viloria, Natasha Oliveros y\nRafael Obregón</b> terminaron el bootcamp de ITSM/ITOM Container — Yelitza y Natasha en la misma sesión de noviembre de 2025. Juan además\ncompletó Advanced AIOps y el Solution Demo bootcamp. El formato ya les es conocido.</p>\n<p>Más útil todavía: dos personas ya avanzaron bastante en HelixGPT por su cuenta. <b>Evelin Pabón</b> tiene nueve\nregistros de cursos de HelixGPT con cinco completados entre marzo y julio de 2026, cubriendo Employee Navigator, Service\nCollaborator, Insight Finder, Ops Swarmer y Service Catalog Curator. <b>Deiry Arias</b> tiene siete, y actualmente está\npresentando el examen <b>BMC Certified Associate: HelixGPT 23.x for Users</b>.</p>\n\n<h3 style=\"margin-bottom:2px\">La recomendación</h3>\n<p>Meter a <b>Evelin y Deiry</b> primero en la sesión de HelixGPT. Ya hicieron el trabajo previo y una de ellas está\npresentando el examen, así que el cupo se convierte en algo concreto. Víctor Touza es quien más capacidad libre tiene de\ntodo el equipo, pero no tiene nada de HelixGPT, así que encaja mejor en la ruta de Portfolio Management que en este\nbootcamp.</p>\n<p>Si se quiere una lista más amplia, la que compartió STI el <b>29 de julio</b> incluía a Arturo Martínez, Yelitza\nViloria, Natasha Oliveros, Evelin Pabón, Roxenis Sanoja, Rafael Obregón, Deiry Arias y Alicia Salazar, además de\nconsultores de monitoreo y observabilidad. Con nombres provisionales basta para reservar cupos y se ajusta después.</p>\n\n<p class=\"note\">Nota de datos: varios registros de bootcamp tienen fecha de inscripción del 17 de junio de 2026 con\nfechas de finalización entre 2023 y 2025, es decir completados antes de inscritos. Es un artefacto de la migración a la\nplataforma Docebo. Las finalizaciones son reales, las fechas de inscripción no.</p>\n\n<p class=\"note\">Nota de datos, corregida el 1 de septiembre de 2026: una versión anterior de esta página decía que Yelitza Viloria y Natasha Oliveros habían completado el bootcamp de ITSM/ITOM Container dos veces. No fue así — cada una lo completó una sola vez, el 7 de noviembre de 2025. El mismo bootcamp aparece en la plataforma bajo dos títulos de catálogo, uno con el sufijo <b>v.HS-Y</b>, porque los bootcamps que se republican como cursos en la plataforma de aprendizaje reciben un segundo código. Una sola asistencia, dos registros. Corregido gracias al aviso de Yelitza.\n</div>\n\n<div class=\"card card-pad section\" style=\"border-left:3px solid var(--warning)\">\n<h2 style=\"margin-top:0\">Portfolio Management: dónde está realmente la formación</h2>\n<p class=\"note\" style=\"margin-top:0\">Actualizado el 27 de agosto después de la llamada de seguimiento. La respuesta\nautorizada vino de <b>Luis Corona, Helix Education</b>, y corrige una lectura anterior del roadmap de formación FY26.</p>\n\n<h3 style=\"margin-bottom:2px\">El curso todavía no está disponible</h3>\n<p>El FY26 Helix Learning Roadmap lista <b>BMC Helix Portfolio Management 25.x: Fundamentals Using</b> bajo Enterprise\nService Management. Ese roadmap es un pronóstico de lo que viene, no un catálogo de lo que ya está publicado.</p>\n<p><b>Luis Corona confirmó que el primer WBT de Portfolio Management sale a finales de septiembre de 2026.</b> Antes de\nesa fecha no hay nada en lo que inscribirse, lo que coincide con lo que STI encontró al buscar en la plataforma sin\nresultado.</p>\n<p class=\"note\">Corrección: una versión anterior de esta página decía que el curso podía arrancar de inmediato. Eso salió\ndel listado del roadmap y era incorrecto. Education maneja el calendario de publicación, y Education dice finales de\nseptiembre.</p>\n\n<h3 style=\"margin-bottom:2px\">Lo que sí está confirmado, sea cual sea el formato</h3>\n<p>Cualquiera que sea la modalidad, incluso con instructor, <b>está cubierto sin costo</b> dentro de la asignación de\nPartner Success. STI es Premier con una asignación FY27 de hasta 30 personas y cero utilizadas. No tiene que ir dentro\nde una propuesta a cliente ni de una bolsa de créditos de servicios, y de todas formas los créditos de servicio son una\nbolsa distinta a la de educación.</p>\n\n<h3 style=\"margin-bottom:2px\">Todavía sin confirmar</h3>\n<ul style=\"margin:4px 0 0;padding-left:18px\">\n<li><b>La modalidad.</b> Si será WBT, con instructor o autogestionado aún no está definido. Confirmación pendiente con Luis Corona.</li>\n<li><b>Si existirá examen de certificación.</b> No aparece ningún examen Associate ni Professional de Portfolio Management\nen todo el roadmap FY26, mientras que todas las demás líneas listan los suyos. Como el producto es de adquisición\nreciente y el currículo se está construyendo, que hoy no exista no cierra la pregunta.</li>\n<li><b>Responsable del currículo</b> de la ruta de Portfolio Management.</li>\n</ul>\n\n<h3 style=\"margin-bottom:2px\">La ruta intermedia, y es buena</h3>\n<p>Portfolio Management está construido sobre <b>BMC Helix Innovation Studio</b>. Yelitza lo dedujo por su cuenta y está\ntomando el curso de Innovation Studio mientras espera la publicación de Portfolio Management. Ese es el puente correcto:\nestá disponible ahora, es la plataforma base, y va a acortar la ruta de Portfolio Management cuando abra.</p>\n<p>Se recomienda la misma vía para cualquier otra persona que STI quiera tener lista en esta línea.</p>\n\n<h3 style=\"margin-bottom:2px\">Nombrados para la ruta</h3>\n<p><b>Natasha Oliveros y Yelitza Viloria</b>, según STI en la llamada del 27 de agosto, sujeto a que Yelitza lo confirme\ninternamente. Dos más con capacidad real si el grupo se amplía: <b>Víctor Touza</b>, que no tiene ninguna renovación este\naño, y <b>Deiry Arias</b>, que no tiene nada que venza antes de marzo de 2027.</p>\n\n<h3 style=\"margin-bottom:2px\">Lo que Helix se comprometió a hacer en la llamada</h3>\n<ul style=\"margin:4px 0 0;padding-left:18px\">\n<li>Confirmar con Luis Corona el nombre exacto del curso, la modalidad y la fecha de publicación.</li>\n<li>Escalar la demanda internamente, incluyendo a los equipos de bootcamp y educación, y empujar para que haya dos o\ntres sesiones de Portfolio Management en lugar de esperar solo la publicación autogestionada.</li>\n<li>Grabar un demo de solución de Portfolio Management para STI cuando haya un ambiente de pruebas disponible.</li>\n<li>Conectar con los instructores que ya trabajan esta línea de producto.</li>\n<li>Actualizar esta página conforme llegue cada pieza.</li>\n</ul>\n</div>\n\n<div class=\"card card-pad section\">\n<h2 style=\"margin-top:0\">Qué hace realmente Helix Portfolio Management</h2>\n<p class=\"note\" style=\"margin-top:0\">Resumen útil si el tema surge en la llamada.</p>\n<p>Seis áreas conectadas: <b>ideas y solicitudes</b>, integradas con Digital Workplace. <b>Gestión de demanda</b>, con\npronóstico, planificación y priorización para la PMO. <b>Gestión de proyectos</b>, con Agile, Waterfall o una mezcla.\n<b>Gestión de portafolio</b>, con una vista de 360 grados de TI y de las líneas de negocio. <b>Gestión de recursos</b>,\ncon capacidad, utilización y competencias. <b>Gestión financiera</b>, con años fiscales, períodos, multimoneda y\nsimulación.</p>\n<p>El punto que lo conecta con lo que STI ya entrega: las decisiones de portafolio quedan ligadas a la actividad real de\nlos proyectos y a los datos de servicio y operaciones, en lugar de vivir en una herramienta de planificación aparte.</p>\n</div>\n\n<div class=\"card card-pad section\" style=\"border-left:3px solid var(--good-ink)\">\n<h2 style=\"margin-top:0\">Acceso a la plataforma — resuelto, y cómo funciona realmente</h2>\n<p><b>Daviuska Viloria está resuelta.</b> La licencia se asignó el 23 de julio, y el registro de aprendizaje ahora la\nmuestra con un curso activo en progreso y último acceso el 10 de agosto. El caso reportado el 16 de julio queda cerrado.</p>\n<p>Vale la pena saberlo para la próxima: agregar a un consultor al Partner Success Subscription Group <b>no</b> le da\nacceso al contenido por sí solo. Hay que asignarle además una licencia de suscripción por separado. Si alguien entra y\nve los cursos con precio de pago, casi siempre es una asignación de licencia incompleta y no un tema de precios.</p>\n</div>\n\n<div class=\"card card-pad section\">\n<h2 style=\"margin-top:0\">La propuesta de cursos para cliente — <em>Validación de Propuesta Cursos para cliente</em></h2>\n\n<p class=\"note\" style=\"margin-top:0\">Contexto: el 10 y el 11 de agosto Yelitza envió una propuesta de cursos con precios para dos clientes en República Dominicana, con el asunto <em>Validación de Propuesta Cursos para cliente</em>, pidiendo a Helix validar las cifras y responder una pregunta sobre qué incluye una suscripción. Estas son las respuestas.</p>\n<h3 style=\"margin-bottom:2px\">1. El nivel de precios</h3>\n<p>Education Services cotiza por nivel regional, y el nivel aplicado en la propuesta fue el que se usa para Estados\nUnidos, Reino Unido, Dinamarca y Suiza. <b>República Dominicana y Venezuela están las dos en la banda LA South</b>, que\nes un nivel bastante más bajo y se cotiza en dólares, así que un mismo juego de cifras sirve para los dos mercados.</p>\n<p>Corregir el nivel baja la propuesta, no la sube, lo que la hace más competitiva y no menos.</p>\n<p><b>Las cifras completas de LA South se enviaron a Yelitza por correo el 28 de agosto</b>, cubriendo suscripciones,\nexámenes de certificación, formación pública con instructor y tarifas por día de curso privado. No se reproducen en esta\npágina.</p>\n\n<h3 style=\"margin-bottom:2px\">2. Las suscripciones se cotizan por pilar de producto</h3>\n<p>Los encabezados de la lista son explícitos: <b>\"Individual Education Subscriptions (per person/product pillar)\"</b> y\n<b>\"Enterprise Subscriptions for Customers (per company/product pillar)\"</b>. Es decir, una suscripción cubre un pilar,\nno todo el catálogo.</p>\n<p>Eso importa porque la lista de cursos de la propuesta abarca seis pilares: Helix ITSM, Digital Workplace, Innovation\nStudio, Business Workflows, Dashboards y CMDB. Dos suscripciones individuales no los cubren todos. Conviene revisar\njuntas qué pilares necesita realmente el cliente.</p>\n<p class=\"note\">Corrección de una lectura anterior: la lista <em>no</em> tiene variantes separadas de Operations\nManagement y Service Management de la suscripción enterprise web. Hay una sola línea genérica.\nLas suscripciones enterprise por pilar se cotizan como porcentaje del gasto en el producto y van listadas aparte.</p>\n\n<h3 style=\"margin-bottom:2px\">3. La pregunta de los WBT sigue abierta</h3>\n<p>La lista tiene una línea para contenido web bajo el encabezado \"Web Based Courses, all Helix products\".\n<b>No</b> indica si los WBT de nivel Using o Fundamentals quedan incluidos para todos los\nusuarios de un cliente bajo alguna suscripción, ni que estén restringidos a personas nombradas. La única redacción de\nalcance es la de por persona y por empresa y pilar de arriba.</p>\n<p>Así que la respuesta honesta al cliente es que las suscripciones individuales son por persona y por pilar, y que lo\nde cobertura para toda la empresa se está confirmando con Helix Education en lugar de deducirlo de la lista de precios.</p>\n\n<h3 style=\"margin-bottom:2px\">4. Opciones que quizás encajen mejor</h3>\n<p>Para una cuenta grande, la <b>Education Enterprise Subscription</b> por producto se cotiza como un porcentaje de lo\nque el cliente gasta en ese producto y no por persona. Para un cliente del tamaño de un banco eso puede salir mejor que\nsumar suscripciones individuales en seis pilares. Se pueden modelar las dos formas si hace falta.</p>\n<p>La lista enviada por correo también cubre exámenes de certificación, tarifas por día de formación pública con\ninstructor, cursos privados en línea y presenciales, y la suscripción esencial solo para partners, de modo que la oferta\nse puede armar sin volver a la lista cada vez.</p>\n\n<h3 style=\"margin-bottom:2px\">5. Autorización para revender servicios de educación</h3>\n<p>Vender servicios de educación de Helix a un cliente final normalmente requiere que esa capacidad esté reconocida por\nescrito en la carta de autorización del partner. Se ha solicitado de forma explícita para otro partner de Partner\nSuccess en una licitación reciente. Conviene confirmar que STI tenga la misma redacción antes de que una propuesta de\ncapacitación entre a una licitación.</p>\n</div>\n\n<div class=\"card card-pad section\" style=\"border-left:3px solid var(--brand)\">\n<h2 style=\"margin-top:0\">Por qué las fechas de renovación importan más allá de los certificados</h2>\n<p>STI tiene nivel Premier tanto en entrega como en ventas, con un registro FY27 en el que todos los proyectos\nregistrados se completaron con éxito. Ese nivel se sostiene en parte con la cobertura certificada por línea de producto.</p>\n<p>La conexión que vale la pena hacer: el trabajo de entrega principal corre sobre <b>Helix ITSM</b> y <b>Discovery</b>.\nDiscovery está cubierto hasta 2028. <b>La cobertura de Helix ITSM llega a cero después de marzo de 2027</b> si no se\nrenueva nada, y lo mismo pasa con AR System. Las renovaciones no son un trámite administrativo, son lo que mantiene al\nequipo certificado en las líneas sobre las que está construida la práctica de entrega.</p>\n<p>Dos temas menores que también pesan en el nivel y no en la entrega: las encuestas de satisfacción todavía no se han\nactivado en ningún proyecto, y varios registros de proyecto siguen apareciendo activos con fechas de fin ya pasadas.\nAmbos se corrigen rápido y ambos se ven en la revisión de nivel.</p>\n</div>\n\n<div class=\"card card-pad section\">\n<h2 style=\"margin-top:0\">Quién debe qué</h2>\n<table style=\"table-layout:auto\">\n<thead><tr><th class=\"nosort\">Acción</th><th class=\"nosort\">Responsable</th><th class=\"nosort\">Fecha</th></tr></thead>\n<tbody>\n<tr><td>Agendar el bloque de renovación Natasha / Naylin / Yelitza, doce certificados</td><td>Helix + STI</td><td>esta semana</td></tr>\n<tr><td>Decidir Roxenis y Rafael — reactivar o migrar a la versión más nueva</td><td>STI</td><td>esta semana</td></tr>\n<tr><td>Nombres provisionales de participantes para HelixGPT y Agent Creation</td><td>Yelitza</td><td>27 ago</td></tr>\n<tr><td>Confirmar los nombres para Portfolio Management y arrancarlos en Innovation Studio mientras tanto</td><td>Yelitza</td><td>próxima semana</td></tr>\n<tr><td>Confirmar modalidad y fecha de publicación con Luis Corona, Helix Education</td><td>Helix</td><td>1 sep</td></tr>\n<tr><td>Empujar a los equipos de educación y bootcamp por dos o tres sesiones de Portfolio Management</td><td>Helix</td><td>septiembre</td></tr>\n<tr><td>Grabar un demo de solución de Portfolio Management cuando haya ambiente de pruebas</td><td>Helix</td><td>septiembre</td></tr>\n<tr><td>Enviar por escrito la lista completa de precios de LA South, mismo nivel que Venezuela</td><td>Helix</td><td>28 ago</td></tr>\n<tr><td>Confirmar por escrito la pregunta de entitlement de los WBT contra la lista FY27</td><td>Helix</td><td>28 ago</td></tr>\n<tr><td>Confirmar cuál variante de suscripción debe llevar la propuesta al cliente</td><td>Yelitza + Helix</td><td>28 ago</td></tr>\n<tr><td>Verificar si la carta de autorización cubre la reventa de servicios de educación</td><td>STI</td><td>próxima semana</td></tr>\n<tr><td>Planificar el bloque de diciembre — Roxenis, Evelin, Rafael y Juan renuevan ese mes</td><td>Helix + STI</td><td>octubre</td></tr>\n<tr><td>Decidir la migración de Juan Ramos de Discovery 22.x a 24.x</td><td>STI</td><td>noviembre</td></tr>\n<tr><td>Identificar un segundo ingeniero certificado en CMDB</td><td>STI</td><td>septiembre</td></tr>\n</tbody></table>\n</div>\n"});

function buildExec(){
  const pct = Math.round(100*T.completed/T.enrollments);
  const zero = BENCH.filter(b=>b.remaining===0);
  const f27pct = Math.round(100*T.fy27/(T.certs - T.expiredNow));
  $('#exec').innerHTML = `
    <div class="kicker">${t('execKicker')}</div>
    <h2>${t('execH')}</h2>
    <p class="lede">${t('execLede',{tot:T.certs, ppl:T.certHolders, act:T.certs-T.expiredNow, exp:T.expiredNow,
       pct, f27:T.fy27, v:T.validPast27})}</p>
    <div class="execsplit">
      <div><h3 style="color:var(--good-ink)">${t('execGoodH')}</h3><ul>
        <li>${t('execG1',{pct, n:nf(T.enrollments), done:nf(T.completed)})}</li>
        <li>${t('execG2',{bcp:T.bcp, p:T.bcpPeople})}</li>
        <li>${t('execG3',{v:T.validPast27})}</li>
      </ul></div>
      <div><h3 style="color:var(--critical)">${t('execGapH')}</h3><ul>
        <li>${t('execP1')}</li>
        <li>${t('execP2',{f:T.fy27, p:T.fy27People, pct:f27pct})}</li>
        <li>${t('execP3',{z:zero.length, names:zero.map(x=>x.family).join(', ')})}</li>
        <li>${t('execP4')}</li>
      </ul></div>
    </div>`;
}
