<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STI 2009 · Consultant Education &amp; Certification Review — FY27</title>
<style>
:root{
  color-scheme: light;
  --plane:#f9f9f7; --surface-1:#fcfcfb;
  --text-primary:#0b0b0b; --text-secondary:#52514e; --text-muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --brand:#12406f;
  --series-1:#185090; --series-2:#eb6834; --series-3:#1baf7a;
  --ord-1:#86b6ef; --ord-2:#4a86d0; --ord-3:#12406f;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-ink:#006300; --wash:rgba(18,64,111,0.07); --hover:rgba(11,11,11,0.035);
  --shadow:0 1px 2px rgba(11,11,11,.05), 0 6px 20px rgba(11,11,11,.05);
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --plane:#0d0d0d; --surface-1:#1a1a19;
  --text-primary:#ffffff; --text-secondary:#c3c2b7; --text-muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
  --brand:#5a9ae0;
  --series-1:#4a90d9; --series-2:#d95926; --series-3:#199e70;
  --ord-1:#8fbcf0; --ord-2:#4a90d9; --ord-3:#1d548f;
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-ink:#0ca30c; --wash:rgba(90,154,224,0.13); --hover:rgba(255,255,255,0.04);
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--plane); color:var(--text-primary);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px 80px}
a{color:var(--brand)}

header.top{border-bottom:1px solid var(--border); background:var(--surface-1)}
.top-inner{max-width:1240px;margin:0 auto;padding:24px 24px 20px;display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted);font-weight:600}
h1{font-size:27px;line-height:1.2;margin:7px 0 6px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--text-secondary);font-size:14px;margin:0;max-width:72ch}
.top-right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{
  font:inherit;font-size:13px;background:var(--surface-1);color:var(--text-primary);
  border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer;
}
.btn:hover{background:var(--hover)}
a.btn{text-decoration:none;display:inline-block}
.btn.primary{background:var(--brand);color:#fff;border-color:transparent;font-weight:550}
a.btn.primary{color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{
  font:inherit;font-size:13px;font-weight:550;background:var(--surface-1);color:var(--text-secondary);
  border:none;padding:7px 13px;cursor:pointer
}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}

nav.tabs{position:sticky;top:0;z-index:30;background:var(--surface-1);border-bottom:1px solid var(--border)}
.tabs-inner{max-width:1240px;margin:0 auto;padding:0 24px;display:flex;gap:2px;overflow-x:auto}
.tab{
  font:inherit;font-size:13.5px;font-weight:520;background:none;border:none;cursor:pointer;
  padding:13px 14px;color:var(--text-secondary);border-bottom:2px solid transparent;white-space:nowrap;
}
.tab:hover{color:var(--text-primary)}
.tab[aria-selected="true"]{color:var(--text-primary);border-bottom-color:var(--brand);font-weight:620}
.panel[hidden]{display:none}
.panel{padding-top:28px}

.card{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.card-pad{padding:20px 22px}
.card h2,.chartcard h2{font-size:16px;margin:0 0 3px;font-weight:620;letter-spacing:-.005em}
.card h3{font-size:13.5px;margin:0 0 2px;font-weight:620}
.note{font-size:12.5px;color:var(--text-muted);margin:0 0 16px}
.grid{display:grid;gap:16px}
.section{margin-bottom:24px}

.exec{background:var(--surface-1);border:1px solid var(--border);border-radius:14px;padding:24px 26px;box-shadow:var(--shadow);border-top:3px solid var(--brand)}
.exec .kicker{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-muted);font-weight:650}
.exec h2{font-size:24px;line-height:1.22;font-weight:650;letter-spacing:-.012em;margin:8px 0 12px;max-width:52ch}
.exec h2 em{font-style:normal;color:var(--brand)}
.exec .lede{font-size:14.5px;color:var(--text-secondary);margin:0;max-width:80ch;line-height:1.55}
.rank{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:20px 0 4px}
.rank .r{border:1px solid var(--border);border-radius:11px;padding:14px 15px;background:var(--plane)}
.rank .r .big{font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1.05}
.rank .r .cap{font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.rank .r .vs{font-size:12.5px;color:var(--text-secondary);margin-top:4px}
.rank .r.win{border-color:color-mix(in srgb,var(--good) 45%,var(--border))}
.rank .r.win .big{color:var(--good-ink)}
.execsplit{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:22px;padding-top:20px;border-top:1px solid var(--grid)}
@media(max-width:880px){.execsplit{grid-template-columns:1fr}}
.execsplit h3{font-size:12px;letter-spacing:.05em;text-transform:uppercase;margin:0 0 9px;font-weight:650}
.execsplit ul{margin:0;padding-left:17px}
.execsplit li{font-size:13.5px;color:var(--text-secondary);margin-bottom:7px;line-height:1.5}
.execsplit li b{color:var(--text-primary)}
.commgrid{display:grid;grid-template-columns:1.15fr 1fr;gap:26px;align-items:start}
@media(max-width:900px){.commgrid{grid-template-columns:1fr}}
.arrhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.arrhead .now{font-size:30px;font-weight:650;letter-spacing:-.02em}
.arrhead .delta{font-size:13.5px;font-weight:650;padding:3px 9px;border-radius:999px}
.arrhead .delta.dn{color:var(--critical);background:rgba(208,59,59,.10)}
.arrhead .delta.up{color:var(--good-ink);background:rgba(12,163,12,.10)}
.custrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.custrow .cn{width:48%;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.custrow .cb{flex:1;height:9px;background:var(--grid);border-radius:5px;overflow:hidden}
.custrow .cb i{display:block;height:100%;background:var(--brand);border-radius:5px}
.custrow .cv{width:104px;white-space:nowrap;text-align:right;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.tierbox{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 0}
.tierbox .tb{border:1px solid var(--border);border-radius:9px;padding:9px 12px;background:var(--plane);flex:1;min-width:150px}
.tierbox .tb .l{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);font-weight:650}
.tierbox .tb .v{font-size:14px;font-weight:640;margin-top:3px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:22px}
.tile{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow);
  text-align:left;font:inherit;color:inherit;cursor:pointer;transition:border-color .12s, transform .12s;position:relative;display:block;width:100%}
.tile:hover{border-color:color-mix(in srgb,var(--brand) 55%,var(--border));transform:translateY(-1px)}
.tile:hover .go{opacity:1}
.tile .go{position:absolute;top:14px;right:14px;font-size:13px;color:var(--brand);opacity:.35;transition:opacity .12s}
.tile .lab{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);font-weight:600}
.tile .val{font-size:31px;font-weight:640;letter-spacing:-.02em;margin:5px 0 1px;line-height:1.05}
.tile .sup{font-size:12.5px;color:var(--text-secondary)}
.tile.accent{border-color:color-mix(in srgb,var(--critical) 45%,var(--border))}
.tile.accent .val{color:var(--critical)}

.callout{display:flex;gap:14px;padding:16px 18px;border-radius:12px;border:1px solid var(--border);background:var(--surface-1);box-shadow:var(--shadow)}
.callout .ic{flex:0 0 auto;width:22px;height:22px;margin-top:1px}
.callout.crit{border-left:3px solid var(--critical)}
.callout.info{border-left:3px solid var(--brand)}
.callout p{margin:5px 0 0;color:var(--text-secondary);font-size:13.5px}
.callout strong{color:var(--text-primary)}

/* action cards */
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.action{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);border-left:3px solid var(--brand)}
.action.urgent{border-left-color:var(--critical)}
.action .k{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);font-weight:650}
.action .h{font-size:15px;font-weight:640;margin:6px 0 5px;line-height:1.3}
.action .h em{font-style:normal;color:var(--critical)}
.action p{margin:0;font-size:13px;color:var(--text-secondary);line-height:1.5}
.action .who{margin-top:9px;display:flex;flex-wrap:wrap;gap:5px}
.action .who span{font-size:11.5px;background:var(--plane);border:1px solid var(--border);border-radius:6px;padding:2px 7px;color:var(--text-secondary)}
.action .cta{margin-top:11px;font-size:12.5px;font-weight:600}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2.5px 8px;border-radius:999px;border:1px solid var(--border);white-space:nowrap}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.chip.good .dot{background:var(--good)} .chip.good{color:var(--good-ink)}
.chip.warn .dot{background:var(--warning)}
.chip.crit .dot{background:var(--critical)} .chip.crit{color:var(--critical)}
.chip.neutral{color:var(--text-secondary)} .chip.neutral .dot{background:var(--text-muted)}
.chip.fy27{color:var(--critical);border-color:color-mix(in srgb,var(--critical) 40%,var(--border))}

.filters{
  display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;
  background:var(--surface-1);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;margin-bottom:16px;
  position:sticky;top:45px;z-index:22;
  box-shadow:0 1px 2px rgba(11,11,11,.05), 0 6px 14px rgba(11,11,11,.06)
}
/* masks the gap between the stuck filter bar and the stuck table header */
.filters::after{content:'';position:absolute;left:-1px;right:-1px;top:100%;height:17px;background:var(--plane)}
.filters label{font-size:11.5px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:4px}
.fgroup{display:flex;flex-direction:column}
input[type=search],select{
  font:inherit;font-size:13.5px;padding:7px 9px;border-radius:8px;
  border:1px solid var(--border);background:var(--plane);color:var(--text-primary);min-width:130px
}
input[type=search]{min-width:230px}
input:focus-visible,select:focus-visible,button:focus-visible,tr:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.count{margin-left:auto;font-size:12.5px;color:var(--text-secondary);padding-bottom:7px}

.tablewrap{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
@media(max-width:1000px){.tablewrap{overflow-x:auto}.tablewrap table{min-width:1000px}}
table{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed}
thead th{
  text-align:left;font-size:11px;letter-spacing:.03em;text-transform:uppercase;color:var(--text-muted);
  font-weight:650;padding:11px 10px;border-bottom:1px solid var(--border);background:var(--surface-1);
  position:sticky;top:45px;z-index:5;cursor:pointer;user-select:none;
  box-shadow:inset 0 -1px 0 var(--border);
}
#rosterTable thead th, #certTable thead th{top:var(--tableTop,45px)}
thead th.nosort{cursor:default}
thead th .arr{opacity:.4;font-size:9px;margin-left:3px}
thead th[aria-sort] .arr{opacity:1;color:var(--brand)}
tbody td{padding:10px 10px;border-bottom:1px solid var(--grid);vertical-align:middle;overflow-wrap:anywhere}
tbody tr:last-child td{border-bottom:none}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:var(--hover)}
tbody tr.open{background:var(--wash)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.name{font-weight:600}
.mail{color:var(--text-muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{font-size:12px;color:var(--text-secondary)}
#rosterTable col.c0{width:19%} #rosterTable col.c1{width:8%} #rosterTable col.c2{width:8.5%}
#rosterTable col.c3{width:7%} #rosterTable col.c4{width:15%} #rosterTable col.c5{width:6%}
#rosterTable col.c6{width:6%} #rosterTable col.c7{width:8%} #rosterTable col.c8{width:12.5%}
#rosterTable col.c9{width:10%}
#certTable col.k0{width:16%} #certTable col.k1{width:28%} #certTable col.kL{width:7%} #certTable col.k2{width:8%}
#certTable col.k3{width:10%} #certTable col.k4{width:10%} #certTable col.k5{width:9%} #certTable col.k6{width:12%}
.lvl{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:2px 6px;border-radius:5px;border:1px solid var(--border)}
.lvl.bcp{background:var(--brand);color:#fff;border-color:transparent}
.lvl.bca{color:var(--text-secondary);background:var(--plane)}
.rev{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;letter-spacing:.02em;
  padding:2px 7px;border-radius:5px;color:#8a5a00;background:rgba(250,178,25,.16);
  border:1px solid color-mix(in srgb,var(--warning) 55%,transparent);white-space:nowrap}
:root[data-theme="dark"] .rev{color:var(--warning);background:rgba(250,178,25,.14)}
tr.reviewrow td{background:rgba(250,178,25,.07)}
#benchTable col.b0{width:26%} #benchTable col.b1{width:14%} #benchTable col.b2{width:14%}
#benchTable col.b3{width:14%} #benchTable col.b4{width:32%}
#certTitleTable col.t0{width:58%} #certTitleTable col.t1{width:10%}
#certTitleTable col.t2{width:12%} #certTitleTable col.t3{width:20%}

.meter{display:flex;align-items:center;gap:8px;min-width:120px}
.meter .track{flex:1;height:7px;border-radius:4px;background:var(--grid);overflow:hidden;display:flex;gap:2px}
.meter .seg2{height:100%;border-radius:4px}
.meter .pct{font-size:12px;color:var(--text-secondary);font-variant-numeric:tabular-nums;min-width:32px;text-align:right}

tr.detail>td{padding:0;background:var(--wash);border-bottom:1px solid var(--border)}
.detail-in{padding:18px 20px 22px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:900px){.dgrid{grid-template-columns:1fr}}
.dcol h4{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);margin:0 0 9px;font-weight:650}
.list{border:1px solid var(--border);border-radius:9px;background:var(--surface-1);max-height:320px;overflow:auto}
.li{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-bottom:1px solid var(--grid);font-size:12.5px}
.li:last-child{border-bottom:none}
.li .t{flex:1;line-height:1.35}
.li .m{color:var(--text-muted);font-size:11.5px;margin-top:2px}
.empty{padding:16px;color:var(--text-muted);font-size:12.5px;text-align:center}

.chartcard{background:var(--surface-1);border:1px solid var(--border);border-radius:12px;padding:20px 22px 16px;box-shadow:var(--shadow)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0 14px}
.legend .item{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-secondary)}
.legend .sw{width:11px;height:11px;border-radius:3px}
svg{display:block;max-width:100%;overflow:visible}
.tt{
  position:fixed;pointer-events:none;z-index:100;background:var(--surface-1);color:var(--text-primary);
  border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12.5px;
  box-shadow:0 4px 16px rgba(0,0,0,.14);opacity:0;transition:opacity .09s;max-width:290px
}
.tt.on{opacity:1}
.tt b{display:block;margin-bottom:2px}
.bigbar{display:flex;gap:2px;height:34px;border-radius:6px;overflow:hidden;margin:6px 0 10px}
.bigbar div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;border-radius:5px}

.statuskey{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.sk{display:flex;gap:11px;align-items:flex-start;padding:11px 12px;border:1px solid var(--border);border-radius:9px;background:var(--plane)}
.sk .chip{flex:0 0 auto;margin-top:1px}
.sk b{display:block;font-size:12.5px;font-weight:650;margin-bottom:1px}
.sk span[data-t]{font-size:12.5px;color:var(--text-secondary);line-height:1.4}
.prose{max-width:80ch}
.prose p{color:var(--text-secondary);font-size:14px}
.prose li{color:var(--text-secondary);font-size:14px;margin-bottom:7px}
.prose h3{color:var(--text-primary);font-size:14.5px;margin:22px 0 7px}
.prose code{background:var(--plane);border:1px solid var(--border);border-radius:5px;padding:1px 5px;font-size:12.5px}
.steps{counter-reset:s;list-style:none;padding:0;margin:14px 0}
.steps li{counter-increment:s;position:relative;padding-left:38px;margin-bottom:14px;color:var(--text-secondary);font-size:14px}
.steps li::before{
  content:counter(s);position:absolute;left:0;top:-1px;width:25px;height:25px;border-radius:50%;
  background:var(--brand);color:#fff;font-size:12.5px;font-weight:650;display:flex;align-items:center;justify-content:center
}
.steps li b{color:var(--text-primary)}
pre.tpl{
  background:var(--plane);border:1px solid var(--border);border-radius:10px;padding:16px 18px;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;line-height:1.65;
  white-space:pre-wrap;color:var(--text-secondary);margin:0
}
.tplhead{display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:880px){.twocol{grid-template-columns:1fr}.top-right{margin-left:0}.grid[style]{grid-template-columns:1fr !important}}
footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--border);color:var(--text-muted);font-size:12.5px}
#p-call .prose,#p-call{max-width:none}
#p-call .card h2{font-size:16px;font-weight:650;margin:0 0 8px}
#p-call .card h3{font-size:13.5px;font-weight:650;margin:16px 0 2px}
#p-call table{width:100%}
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div>
      <div class="eyebrow" data-t="eyebrow"></div>
      <h1 data-t="h1"></h1>
      <p class="sub" data-t="sub"></p>
    </div>
    <div class="top-right">
      <div class="seg" role="group" aria-label="Language / Idioma">
        <button type="button" id="langEs" aria-pressed="true">Español</button>
        <button type="button" id="langEn" aria-pressed="false">English</button>
      </div>
      <button class="btn" id="themeBtn" type="button"></button>
      <a class="btn primary" id="mailTop" href="#" data-t="btnMail"></a>
    </div>
  </div>
</header>

<nav class="tabs">
  <div class="tabs-inner" role="tablist">
    <button class="tab" role="tab" data-p="overview" aria-selected="true" data-t="tabOverview"></button>
    <button class="tab" role="tab" data-p="roster" aria-selected="false" data-t="tabRoster"></button>
    <button class="tab" role="tab" data-p="certs" aria-selected="false" data-t="tabCerts"></button>
    <button class="tab" role="tab" data-p="coverage" aria-selected="false" data-t="tabCoverage"></button>
    <button class="tab" role="tab" data-p="manage" aria-selected="false" data-t="tabManage"></button>
    <button class="tab" role="tab" data-p="call" aria-selected="false" data-t="tabCall"></button>
    <button class="tab" role="tab" data-p="notes" aria-selected="false" data-t="tabNotes"></button>
  </div>
</nav>

<div class="wrap">

 footer2:'Roster changes: ',
 notes:`<h2>What is in here, and where it came from</h2>
<p>Two Learning @ Helix exports, filtered to the STI branches only: a course-progress export covering every enrollment, and the PAE All Certification Data export, both of 20 October 2026. Nothing has been added or estimated beyond the derived fields described below.</p>
<ul>
<li><b>Course progress</b> — 517 enrollment records across 31 consultants, spanning enrollments from 2 Apr 2023 to 14 Oct 2026.</li>
<li><b>Certifications</b> — 67 certification records across 12 consultants: 35 active and 32 expired.</li>
<li><b>Branches included</b> — <code>Partners &gt; Soluciones en TI 2009 C.A.</code> — 30 consultants, all Venezuela-based — plus one STI-domain account registered under the Etech entity, and one STI account filed under a customer branch, both included.</li>
<li><b>Etech sales accounts</b> on etechint.com addresses are not included. They hold sales enablement courses only, no technical certifications.</li>
<li><b>No records are currently marked under review.</b></li>
<li><b>Consultant email addresses have been deliberately removed from this file</b> — not hidden, removed. Names are kept because a lead needs them to act; the addresses added nothing here and would have been the one genuinely sensitive thing in a shared link. If you need a version with emails for a bulk platform action, ask us for it directly rather than circulating this one.</li>
<li><b>Certification levels</b> — <b>BCA</b> is BMC Certified Associate and <b>BCP</b> is BMC Certified Professional.  Level is read from the certification title, which is how the platform records it.</li>
<li><b>Thirty-two certifications have already expired.</b> Of the 35 still active, 19 stay valid into FY28 and beyond and 16 lapse during FY27. That is the split used throughout.</li>
<li><b>Course and certification titles are shown exactly as they appear in the platform</b> — they are official BMC product and exam names and are not translated in either language.</li>
</ul>
<h3>Two things the export does not do well — stated plainly</h3>
<ul>
<li><b>15 of the 31 consultants have no platform last-access date.</b> The field is simply empty for them. Rather than show them all as never active, last activity here is derived from the most recent real event on the record — a course completion, a course access, a certification issue date, or an enrollment. Where the platform&rsquo;s own last-access date exists, that is used. Each row states which source it used.</li>
<li><b>The Course Progress (%) column is not reliable.</b> It reads 0 for 502 of the 517 rows, including for courses marked completed, so it has been left out entirely. Course status — Completed, In Progress, Enrolled — is shown instead, because that field is populated on every row.</li>
</ul>
<h3>How the derived fields work</h3>
<ul>
<li><b>Last activity</b> = the most recent of: platform last access, course completion date, course last-access date, certification issue date, enrollment date.</li>
<li><b>Activity status</b> — Active is activity within 30 days, Slipping is 31–90 days, Stale is over 90 days or no dated activity at all.</li>
<li><b>Open coursework</b> = enrollments marked In Progress plus those marked Enrolled but never started.</li>
<li><b>Bench after FY27</b> = consultants certified in a product line, minus those whose only certification in that line lapses before 31 March 2027.</li>
<li><b>FY27</b> is taken as <b>1 April 2026 – 31 March 2027</b>. If STI runs a different fiscal calendar, tell us and we re-cut it.</li>
<li>Everything is a snapshot as of <b>20 October 2026</b>. It does not refresh on its own.</li>
</ul>
<h3>What this file is not</h3>
<p>It is a read-only snapshot for review, not a live system. Changing anything — adding a consultant, removing one, re-enrolling someone — happens in Learning @ Helix, and the fastest route is the email on the <b>Add / remove consultants</b> tab.</p>`,
 notesQ:`<h2>Questions or corrections</h2><p>If a consultant is missing, listed under the wrong entity, or has left STI, that is a data issue worth fixing at the source rather than in this file. Email <a href="mailto:partner.success@helixops.ai">partner.success@helixops.ai</a> and we correct the record in Learning @ Helix.</p>`
},

/* ================= tooltip ================= */
const tt = $('#tt');
function showTT(e, html){ tt.innerHTML = html; tt.classList.add('on'); moveTT(e); }
function moveTT(e){
  const r = tt.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  tt.style.left = x+'px'; tt.style.top = y+'px';
}
const hideTT = () => tt.classList.remove('on');
function bindTT(el, html){
  el.addEventListener('mouseenter', e=>showTT(e, html));
  el.addEventListener('mousemove', moveTT);
  el.addEventListener('mouseleave', hideTT);
  el.setAttribute('tabindex','0');
  el.addEventListener('focus', ()=>{ const b=el.getBoundingClientRect(); showTT({clientX:b.left+b.width/2, clientY:b.top}, html); });
  el.addEventListener('blur', hideTT);
}
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

  const max = Math.max(...c.arr), W=560, H=150, pad={t:16,r:14,b:30,l:56};
  const iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  const pts = c.arr.map((v,i)=>[pad.l + iw*i/(c.arr.length-1), pad.t + ih - ih*v/max]);
  const line = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const col = cssv('--brand'), muted = cssv('--text-muted');
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img">`;
  [0,0.5,1].forEach(f=>{ const y=pad.t+ih-ih*f;

  }).join('');
  $('#certHead').textContent = t('certHead', {n:T.fy27, p:T.fy27People});
  $$('.tile[data-act]').forEach(b=>b.onclick=()=>tileAction(b.dataset.act));
}

/* clicking a KPI applies the matching filters and jumps to the right tab */
function tileAction(act){
  const [tab, mode] = act.split(':');
  if (tab==='roster'){
    openRows.clear();
    $('#q').value=''; $('#fCountry').value=''; $('#fStatus').value='';
    $('#fCert').value = mode==='hascert' ? 'has' : '';
    $('#fOpen').value = mode==='open' ? 'yes' : '';
    rSort = mode==='done' ? {k:'completionRate', dir:-1}
          : mode==='open' ? {k:'openCount', dir:-1}
          : mode==='hascert' ? {k:'certsActive', dir:-1}
          : {k:'enrollments', dir:-1};
    renderRoster(); goTab('roster');
  } else {
    $('#cq').value=''; $('#cCountry').value='';
    $('#cLevel').value = (mode==='bca'||mode==='bcp') ? mode.toUpperCase() : '';
    $('#cFy').value = (mode==='all'||mode==='bca'||mode==='bcp') ? '' : (mode==='valid' ? '' : mode.toUpperCase());
    if (mode==='valid') { $('#cFy').value=''; }
    cSort = {k:'renew', dir:1};
    renderCerts(); goTab('certs');
  }
}

  const m = {};

    (m[k] = m[k] || {k, fy:f, q, n:0, people:new Set()});

/* ================= roster ================= */
let rSort = {k:'enrollments', dir:-1};
const openRows = new Set();
const statusLabel = s => s==='Active'?t('statusActive') : s==='Slipping'?t('statusSlipping') : t('statusStale');
const courseStatusLabel = s => s==='Completed'?t('stCompleted') : s==='In Progress'?t('stInProgress') : t('stNotStarted');
function statusChip(p){
  const cls = p.status==='Active'?'good':p.status==='Slipping'?'warn':'crit';
  return `<span class="chip ${cls}"><span class="dot"></span>${statusLabel(p.status)}</span>`;
}
function meter(p){
  const tt2 = p.enrollments || 1;
  const wc=100*p.completed/tt2, wi=100*p.inProgress/tt2, wn=100*p.notStarted/tt2;
  return `<div class="meter"><div class="track">
    ${wc?`<div class="seg2" style="flex:0 0 ${wc}%;background:var(--ord-3)"></div>`:''}
    ${wi?`<div class="seg2" style="flex:0 0 ${wi}%;background:var(--ord-2)"></div>`:''}
    ${wn?`<div class="seg2" style="flex:0 0 ${wn}%;background:var(--ord-1)"></div>`:''}
  </div><span class="pct">${p.completionRate}%</span></div>`;
}
function rosterFiltered(){
  const q = $('#q').value.trim().toLowerCase();
  const c=$('#fCountry').value, s=$('#fStatus').value, ce=$('#fCert').value, op=$('#fOpen').value;
  return P.filter(p=>{
    if (q && !p.name.toLowerCase().includes(q)) return false;
    if (c && (c==='__none' ? p.country : p.country !== c)) return false;
    if (s && p.status !== s) return false;
    if (ce==='has' && p.certsActive===0) return false;
    if (ce==='none' && p.certsActive>0) return false;
    if (ce==='fy27' && p.fy27===0) return false;
    if (op==='yes' && p.openCount===0) return false;
    if (op==='none' && p.openCount>0) return false;
    return true;
  });
}
function renderRoster(){
  const rows = rosterFiltered();
  const k = rSort.k==='daysSince' ? 'sortDays' : rSort.k;
  rows.sort((a,b)=>{
    const x=a[k], y=b[k];
    if (typeof x==='string') return rSort.dir * x.localeCompare(y);
    return rSort.dir * ((x??-1)-(y??-1));
  });
  $('#rosterCount').textContent = t('rosterCount',{n:rows.length, t:P.length});
  $('#rosterBody').innerHTML = rows.map(p=>{
    const last = p.lastActivity ? `${fmtD(p.lastActivity)}<div class="mini">${t('daysAgo',{n:p.daysSince})}</div>` : `<span class="mini">${t('noDated')}</span>`;
    return `<tr class="row${openRows.has(p.id)?' open':''}" data-e="${esc(p.id)}" tabindex="0">
      <td><div class="name">${esc(p.name)}</div></td>
      <td class="mini">${esc(p.country||'—')}</td>
      <td class="num">${p.enrollments}</td>
      <td>${meter(p)}</td>
      <td class="num">${p.openCount||'<span style="color:var(--text-muted)">0</span>'}</td>
      <td class="num">${p.certsActive||'<span style="color:var(--text-muted)">0</span>'}${p.review?`<div class="rev" style="margin-top:3px">${t('revShort')}</div>`:''}</td>
      <td class="num">${p.fy27?`<span style="color:var(--critical);font-weight:650">${p.fy27}</span>`:'<span style="color:var(--text-muted)">—</span>'}</td>
      <td>${last}</td>
      <td>${statusChip(p)}</td>
    </tr>` + (openRows.has(p.id) ? detailRow(p) : '');
  }).join('');
  $$('#rosterBody tr.row').forEach(tr=>{
    const toggle = ()=>{ const e=tr.dataset.e; openRows.has(e)?openRows.delete(e):openRows.add(e); renderRoster(); };
    tr.onclick = toggle;
    tr.onkeydown = ev => { if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); toggle(); } };
  });
}
function detailRow(p){

  const certList = p.certs.length ? p.certs.map(c=>{

  const openList = inprog.length ? inprog.map(c=>
    `<div class="li"><div class="t">${esc(c.title)}<div class="m">${esc(c.cat)}${c.delivery?' · '+esc(c.delivery):''} · ${t('liEnrolled',{d:fmtD(c.enrolled)})}</div></div>
      <span class="chip ${c.status==='In Progress'?'warn':'neutral'}"><span class="dot"></span>${courseStatusLabel(c.status)}</span></div>`).join('')
    : `<div class="empty">${t('emptyOpen')}</div>`;
  const doneList = done.length ? done.slice().sort((a,b)=>(b.completed||'').localeCompare(a.completed||'')).map(c=>
    `<div class="li"><div class="t">${esc(c.title)}<div class="m">${esc(c.cat)} · ${t('liCompleted',{d:fmtD(c.completed)})}${c.score?' · '+t('liScore',{s:esc(c.score)}):''}</div></div></div>`).join('')
    : `<div class="empty">${t('emptyDone')}</div>`;
  const src = p.activitySource==='Platform access' ? t('srcPlatform') : t('srcDerived');
  return `<tr class="detail"><td colspan="9"><div class="detail-in">
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px">
      <span style="font-weight:650;font-size:15px">${esc(p.name)}</span>
      ${p.country?`<span class="chip neutral">${esc(p.country)}</span>`:''}
      ${statusChip(p)}
      <span class="mini" style="margin-left:auto">${t('detLast',{d:p.lastActivity?fmtD(p.lastActivity):'—', s:src})}</span>
    </div>
    <div class="dgrid">
      <div class="dcol"><h4>${t('detCerts',{n:p.certs.length})} · ${p.bca} BCA · ${p.bcp} BCP${p.fy27?` — <span style="color:var(--critical)">${t('detFy27',{n:p.fy27})}</span>`:''}</h4><div class="list">${certList}</div></div>
      <div class="dcol"><h4>${t('detOpen',{n:inprog.length})}</h4><div class="list">${openList}</div></div>
    </div>
    <div class="dcol" style="margin-top:18px"><h4>${t('detDone',{n:done.length})}</h4><div class="list">${doneList}</div></div>
  </div></td></tr>`;
}

/* ================= certs table ================= */
let cSort = {k:'renew', dir:1};
function certFiltered(){
  const q = $('#cq').value.trim().toLowerCase();
  const f=$('#cFy').value, c=$('#cCountry').value, lv=$('#cLevel').value;
  return C.filter(x=>{
    if (q && !(x.person.toLowerCase().includes(q) || x.title.toLowerCase().includes(q))) return false;
    if (f && x.fy !== f) return false;
    if (lv && x.level !== lv) return false;
    if (c && x.country !== c) return false;
    return true;
  });
}
function renderCerts(){
  const rows = certFiltered();
  rows.sort((a,b)=>{
    const x=a[cSort.k], y=b[cSort.k];
    if (typeof x==='string' || x==null) return cSort.dir * String(x??'').localeCompare(String(y??''));
    return cSort.dir * (x-y);
  });
  const n27 = rows.filter(r=>r.fy==='FY27' && r.status==='Active').length;
  const nbca = rows.filter(r=>r.level==='BCA').length, nbcp = rows.filter(r=>r.level==='BCP').length;
  $('#certCount').textContent = (n27 ? t('certCountFy',{n:rows.length,f:n27}) : t('certCount',{n:rows.length}))
    + ` · ${nbca} BCA · ${nbcp} BCP`;
  $('#certBody').innerHTML = rows.map(r=>{
    const f27 = r.fy==='FY27', dl = r.daysToRenew;
    const urg = dl==null ? 'neutral' : dl<=120 ? 'crit' : dl<=250 ? 'warn' : 'neutral';
    return `<tr class="${r.review?'reviewrow':''}">
      <td><div class="name">${esc(r.person)}</div>${r.review?`<span class="rev">${t('revBadge')}</span>`:''}</td>
      <td>${esc(r.title)}</td>
      <td><span class="lvl ${r.level==='BCP'?'bcp':'bca'}">${esc(r.level)}</span></td>
      <td class="mini">${fmtD(r.issued)}</td>
      <td style="${f27?'color:var(--critical);font-weight:600':''}">${fmtD(r.renew)}</td>
      <td class="num">${dl==null?'—':`<span class="chip ${urg}"><span class="dot"></span>${dl}</span>`}</td>
      <td><span class="chip ${f27?'fy27':'neutral'}">${esc(r.fy)}</span></td>
    </tr>`;
  }).join('') || `<tr><td colspan="7" class="empty">${t('noMatch')}</td></tr>`;
}
$$('#certTable thead th[data-k]').forEach(th=>{

    cSort = {k, dir: cSort.k===k ? -cSort.dir : 1};
    $$('#certTable thead th').forEach(x=>x.removeAttribute('aria-sort'));
    th.setAttribute('aria-sort', cSort.dir===1?'ascending':'descending');

});

/* ================= draw ================= */
function syncSticky(){
  const panel = $$('.panel').find(p=>!p.hidden);
  const f = panel && panel.querySelector('.filters');
  const h = f ? Math.round(f.getBoundingClientRect().height) : 0;
  // 45px nav + filter-bar height + the 17px mask that hides the gap beneath it
  document.documentElement.style.setProperty('--tableTop', (45 + h + 17) + 'px');
}
function drawAll(){ drawStatus(); drawQ(); drawM(); drawTops(); drawCat(); syncSticky(); }
if (window.ResizeObserver) {
  const ro = new ResizeObserver(()=>syncSticky());
  $$('.filters').forEach(f=>ro.observe(f));
}

Object.assign(I.en, {"tabCall": "Open items", "h1": "Soluciones en TI 2009 — Education &amp; Certification Review", "sub": "Where every certification stands as of 20 October 2026, which ones lapse before you can staff the next project, and how to change the learning roster in one email. Thirty-two certifications have lapsed, nineteen of them since late September, and none of the renewal exams is booked. Six more expire in December, before the January and February exam window under discussion. The operational detail sits behind each tab.", "execKicker": "Executive summary · 20 October 2026", "execH": "Thirty-two certifications have lapsed, and the Premier BCP count falls below six at the end of December unless renewals are booked now.", "execLede": "STI holds {tot} certification records across {ppl} certified consultants, {act} of them active and {exp} already lapsed. {pct}% of every course the team enrolls in gets finished. The depth is real. The exposure is the concentration of renewal dates: {f27} of the {act} active certifications lapse before 31 March 2027, and only {v} run into FY28.", "execGoodH": "What is working", "execGapH": "Where the exposure is", "execG1": "{pct}% course completion across {n} enrollments, with {done} finished.", "execG2": "{bcp} Professional-level certifications live, held by {p} consultants.", "execG3": "Discovery, Operations Management, Client Management and CMDB are all covered into 2028 — {v} certifications run past FY27.", "execP1": "Nineteen certifications expired between 24 September and 15 October. Natasha Oliveros and Naylin García now hold no active certification, and Yelitza Viloria keeps only her Professional Helix ITSM. None of the renewal exams had been booked as of 20 October.", "execP2": "{f} certifications across {p} consultants lapse before 31 March 2027 — {pct}% of everything active.", "execP3": "{z} product lines fall to zero certified consultants after FY27: {names}.", "execP4": "The next lapses come before any January exam window: Jesús Gavidia on 6 November, Juan Ramos on 11 November, Roxenis Sanoja on 18 December, Evelin Pabón and Rafael Obregón on 26 December, and Juan Ramos again on 27 to 29 December.", "tiles": [["Consultants with learning activity", "Soluciones en TI 2009 C.A. · Etech · Venezuela"], ["Course enrollments", "225 distinct courses"], ["Completed", "{pct}% of all enrollments"], ["Still open", "{ip} in progress · {ns} not started"], ["Certifications on record", "{bca} BCA · {bcp} BCP active · held by {ch} people"], ["Lapsing in FY27", "{f27bca} BCA · {f27bcp} BCP · {p} consultants"]], "revH": "Thirty-two certifications have lapsed. Eight more expire before the end of December.", "revP": "<b>6 November:</b> Jesús Gavidia (Client Management 20.x).<br><b>11 November:</b> Juan Ramos (Helix Dashboards 23.x).<br><b>18 December:</b> Roxenis Sanoja, AR System 22.x and Helix ITSM 22.x.<br><b>26 December:</b> Evelin Pabón and Rafael Obregón, Professional Helix ITSM 22.x.<br><b>27 to 29 December:</b> Juan Ramos, Discovery 22.x ×3, including his Professional.<br><br>Lapsed since the last review: Natasha Oliveros, Naylin García and Yelitza Viloria lost Digital Workplace Advanced License, AR System 22.x and Helix ITSM 22.x on 26 and 27 September. Juan Ramos lost Service Monitoring, Continuous Optimization and Client Management 20.x. Arturo Martínez lost four and Christian Arámbulo three between 3 and 13 October.", "entList": ["STI is <b>Premier</b>, which carries an FY27 entitlement of <b>up to 30 individuals</b> for technical education and certification.", "Technical education and certification for STI&rsquo;s own consultants comes at <b>no cost</b> under the Partner Success program.", "<b>Bootcamps are included</b> in that entitlement.", "That covers the renewals in this review, the Professional-level upgrades, and the Portfolio Management path.", "None of it needs to sit inside a customer proposal or a services credit pool."], "footer": "Prepared for Soluciones en TI 2009 by Partner Success, Learning @ Helix · Snapshot as of 20 October 2026, updated 22 October · Source: NS Full Book Course Progress and Certifications exports, filtered to the Soluciones en TI 2009 branches · Pricing figures and commercial detail are shared by email rather than published here. Please treat this page as internal to STI and Helix.", "callBody": "\n<div class=\"card card-pad section\">\n<h2 style=\"margin-top:0\">How to use this page</h2>\n<p>This tab tracks everything open between STI and Helix. It was refreshed on 22 October 2026 from the Learning @ Helix extract of 20 October, ahead of the 22 October cadence call. Each item is either a decision needed from STI, an answer owed by Helix, or context for both. The other tabs hold the underlying data: the\n<b>Consultant roster</b> lets you click any name to open that person's full course and certification history, the\n<b>Certifications</b> tab lists every credential with its renewal date, and the <b>Certified bench</b> tab shows how many\npeople are certified per product line today and after this fiscal year.</p>\n<p class=\"note\">Two pieces of vocabulary used throughout. <b>BCA</b> is BMC Certified Associate, the foundational\ncredential. <b>BCP</b> is BMC Certified Professional, the higher tier and the scarcer one. Both count toward STI's\npartner accreditation. Every certification runs for two years from the date it was issued, and a lapsed credential stops\ncounting on the day it expires, not at the end of the year.</p>\n</div>\n\n<div class=\"card card-pad section\" style=\"border-left:3px solid var(--good-ink)\">\n<h2 style=\"margin-top:0\">What moved since September</h2>\n<ul style=\"margin:4px 0 0;padding-left:18px\">\n<li><b>Portfolio Management training is live.</b> <em>BMC Helix Portfolio Management 26.3: Fundamentals (WBT)</em> was corrected by Helix Education and has carried its full content since 19 October. Yelitza Viloria and Natasha Oliveros both enrolled on 13 October and show the course in progress.</li>\n<li><b>Yelitza started the on-premises deployment path.</b> On 14 October she enrolled in four Helix Service Management deployment courses and the <em>Certified Associate: Helix Service Management On-Premises Deployment 25.x</em> exam. That lines up directly with the Helix On-Premises 26.4 Preview Program invitation sent on 19 October.</li>\n<li><b>Rafael Obregón is working toward Innovation Studio.</b> He enrolled in the assisted self-paced Innovation Studio 26.x course on 10 September and has the <em>Certified Associate: Helix Innovation Studio 26.x for Developers</em> exam in progress. Innovation Studio is the platform Portfolio Management is built on.</li>\n<li><b>The documentation access case is closed.</b> Natasha confirmed on 19 October that the links now resolve to the Helix documentation site. The error came from older links that still pointed at the previous domain.</li>\n</ul>\n</div>\n\n<div class=\"card card-pad section\" style=\"border-left:3px solid var(--critical)\">\n<h2 style=\"margin-top:0\">What is still open</h2>\n<p class=\"note\" style=\"margin-top:0\">The September calls on 10 and 24 September did not go ahead, so follow-up ran by email. The last live conversation was on 8 October. This list reflects everything since then.</p>\n\n<h3 style=\"margin-bottom:2px\">What Helix needs from STI</h3>\n<ol class=\"steps\">\n<li><b>A renewal date for the December group, before the end of November.</b> On 8 October the area coordinators were planning exams for January or February 2027. That is too late for six credentials that expire in December: Roxenis Sanoja&rsquo;s AR System 22.x and Helix ITSM 22.x (18 December), the Professional Helix ITSM 22.x held by Evelin Pabón and Rafael Obregón (26 December), and Juan Ramos&rsquo;s three Discovery 22.x credentials, including his Professional (27 to 29 December). Two more come first: Jesús Gavidia&rsquo;s Client Management 20.x on 6 November and Juan&rsquo;s Helix Dashboards 23.x on 11 November. Recertification has to be passed <em>before</em> the expiry date.\n<br><span class=\"note\">Owner: STI · As of the 20 October extract, none of these renewal exams is booked.</span></li>\n\n<li><b>A decision on the credentials that have already lapsed.</b> Since the last review, nineteen more expired between 24 September and 15 October. Natasha Oliveros and Naylin García now hold no active certification. Yelitza Viloria keeps only her Professional Helix ITSM 22.x. Arturo Martínez, Christian Arámbulo and Juan Ramos lost Service Monitoring, Continuous Optimization, Operations Management and Client Management 20.x credentials in early October. The choice for each is whether to recover the same version or move to the current one, which runs two years.\n<br><span class=\"note\">Owner: STI · Helix is confirming with Education whether Helix ITSM 22.x stays available once 23.x is released, so the choice of version is not wasted effort.</span></li>\n\n<li><b>Participant names for the bootcamps.</b> The 12 October HelixGPT session for the Americas passed without STI participants. Helix is also gauging interest in an additional Agent Creation session in Americas hours (five half days, in English) and asked for names and whether anyone has their own Helix tenant. Víctor Touza is a good candidate: both his certifications run to 2028 and he has no renewals this year.\n<br><span class=\"note\">Owner: STI · Provisional names are enough to hold seats.</span></li>\n\n<li><b>Two details on the Claro Dominicana records.</b> For the managed service (PS-00001173): the exact contract end date in 2029, and whether the Discovery consulting record (PS-00001169) is part of it. For the 2024 Discovery project recorded under &ldquo;CLARO S.A.&rdquo; (PS-00000372): which country, and the end date.\n<br><span class=\"note\">Owner: Alicia Salazar · Asked 20 October</span></li>\n\n<li><b>Who joins the On-Premises 26.4 Preview Program.</b> It is by invitation, aimed at the consultant who runs containerized on-premises deployments. Joining takes three steps: a Helix Community account, the Customer Programs Agreement signed with the full legal company name, and a request for access to the program community.\n<br><span class=\"note\">Owner: STI · Invitation sent 19 October</span></li>\n\n<li><b>The open items from the customer course proposal.</b> Which subscription variant the proposal should carry, whether STI&rsquo;s authorization letter covers resale of education services, and the exact name or a screenshot of the HelixGPT course Yelitza asked about.\n<br><span class=\"note\">Owner: Yelitza</span></li>\n</ol>\n\n<h3 style=\"margin-bottom:2px\">What Helix owes STI</h3>\n<ol class=\"steps\">\n<li><b>A written answer on Helix ITSM 22.x versus 23.x.</b> Whether the 22.x exam is retired when 23.x arrives, so the team studies for the version that will still exist.\n<br><span class=\"note\">Owner: Helix · Being confirmed with Education</span></li>\n<li><b>A recorded Portfolio Management demo</b> once a test environment is available, to sit alongside the course.\n<br><span class=\"note\">Owner: Helix · Open</span></li>\n<li><b>Registration of the client and engagement statuses</b> in Tech Central as STI confirms them.\n<br><span class=\"note\">Owner: Helix, on receipt</span></li>\n</ol>\n</div>\n\n<div class=\"card card-pad section\" style=\"border-left:3px solid var(--brand)\">\n<h2 style=\"margin-top:0\">Why the December dates matter for Premier</h2>\n<p>The FY27 partner program counts <b>BCP individuals</b>, meaning people, not certificates. Premier needs <b>six</b>. Today STI has <b>seven</b>: Christian Arámbulo, Deiry Arias, Evelin Pabón, Juan Ramos, Rafael Obregón, Roxenis Sanoja and Yelitza Viloria.</p>\n<ul style=\"margin:4px 0 0;padding-left:18px\">\n<li><b>26 to 29 December 2026:</b> Evelin&rsquo;s and Juan&rsquo;s only Professional credentials expire, and Rafael&rsquo;s Helix ITSM Professional with them. Rafael keeps his CMDB Professional. The count falls to <b>five</b>, below the Premier minimum.</li>\n<li><b>24 to 30 March 2027:</b> Roxenis&rsquo;s and Yelitza&rsquo;s Professional Helix ITSM credentials expire, and Deiry&rsquo;s ITSM Professional with them. The count falls to <b>three</b>: Christian, Deiry and Rafael.</li>\n</ul>\n<p>Separately, if nothing is renewed, <b>Helix ITSM and AR System reach zero certified people after March 2027</b>, and Digital Workplace already rests on Deiry Arias alone. These are the product lines the current delivery work runs on.</p>\n<p>Technical education and certification for STI&rsquo;s own consultants is covered at <b>no cost</b> under the Premier entitlement, which allows up to 30 individuals a year. Renewals, recoveries and Professional upgrades all fit inside it.</p>\n</div>\n\n<div class=\"card card-pad section\" style=\"border-left:3px solid var(--warning)\">\n<h2 style=\"margin-top:0\">Portfolio Management: where the training stands now</h2>\n<p><b>The first course is available.</b> <em>BMC Helix Portfolio Management 26.3: Fundamentals (WBT)</em> is enrollable at no cost. On 14 October STI reported that it opened only an evaluation survey. Education corrected it, and the full content has been in place since 19 October. If anyone completed the survey before then, the course may show as finished without the content. Tell us and we will have it reset.</p>\n<p><b>In progress:</b> Yelitza Viloria and Natasha Oliveros, both enrolled on 13 October.</p>\n<p><b>The webinar recording.</b> Helix ran an open webinar on 21 October, <em>From Strategy to Delivery: HPM, Waterfall &amp; Agile in Practice</em>. Registering through the event page gives access to the recording.</p>\n<p><b>The foundation still applies.</b> Portfolio Management is built on Innovation Studio, Digital Workplace Catalog and Helix Dashboards, the same three areas the official implementation service asks the customer team to know. Rafael Obregón&rsquo;s Innovation Studio work and Deiry Arias&rsquo;s Digital Workplace Professional are both directly relevant.</p>\n<p><b>Still unconfirmed:</b> whether a Portfolio Management certification exam will exist. None has been announced.</p>\n</div>\n\n<div class=\"card card-pad section\">\n<h2 style=\"margin-top:0\">Bootcamps: what they are and what is outstanding</h2>\n<p>Scheduled, instructor-led group sessions with a hands-on environment for each attendee, which is why seats are capped across all partners. <b>HelixGPT</b> covers the Helix AI layer. <b>Agent Creation</b> covers building AI agents on top of it, so HelixGPT comes first.</p>\n<p>STI is not starting from zero. Juan Ramos, Yelitza Viloria, Natasha Oliveros and Rafael Obregón have completed the ITSM/ITOM Container bootcamp, and Juan also completed Advanced AIOps and the Solution Demo bootcamp. <b>Evelin Pabón</b> and <b>Deiry Arias</b> are the furthest along on HelixGPT on their own, and Deiry has the <em>Certified Associate: HelixGPT 23.x for Users</em> exam in progress. Both are natural first names for the next HelixGPT session.</p>\n<p class=\"note\">Data note: several bootcamp records carry an enrollment date of 17 June 2026 with completion dates in 2023 to 2025. That is an artifact of the learning platform migration. The completions are real, the enrollment dates are not. The ITSM/ITOM Container bootcamp also appears under two catalog titles, so one attendance can show as two records.</p>\n</div>\n\n<div class=\"card card-pad section\">\n<h2 style=\"margin-top:0\">The customer course proposal — <em>Validación de Propuesta Cursos para cliente</em></h2>\n<p class=\"note\" style=\"margin-top:0\">Confirmed by Luis Corona, Helix Education, on 27 August. Pricing figures were sent by email and are not reproduced here.</p>\n<p><b>Two subscription families only: ITSM and ITOM.</b> All six product areas in the proposal (Helix ITSM, Digital Workplace, Innovation Studio, Business Workflows, Dashboards and CMDB) sit inside the ITSM family, so one ITSM subscription covers all of them. The Dominican Republic and Venezuela share the LA South pricing band.</p>\n<div class=\"scroll\"><table style=\"table-layout:auto\">\n<thead><tr><th class=\"nosort\">Option</th><th class=\"nosort\">Who it covers</th><th class=\"nosort\">Duration</th><th class=\"nosort\">Formats</th><th class=\"nosort\">Certification</th></tr></thead><tbody>\n<tr><td><b>Enterprise Web-Based</b></td><td>Unlimited employees, company-wide</td><td>12 months</td><td>Web-based courses (WBT) and online exams only</td><td>Up to Associate</td></tr>\n<tr><td><b>Individual Associate</b></td><td>One named person</td><td>6 months</td><td>WBT, instructor-led (ILT) and assisted self-paced (ASP)</td><td>Associate</td></tr>\n<tr><td><b>Individual Professional</b></td><td>One named person</td><td>12 months</td><td>WBT, ILT and ASP</td><td>Associate and Professional</td></tr>\n</tbody></table></div>\n<p><b>The boundary that trips people up:</b> Enterprise includes the Associate administrator <em>exams</em>, but not the multi-day administrator <em>training</em> that prepares people for them. The <a href=\"https://www.helixops.ai/content/dam/bmc/education/BMCHelix_Learning_Tracks.pdf\" target=\"_blank\" rel=\"noopener\">Learning Paths and Certifications</a> document marks every course <b>E</b>, <b>A</b> or <b>P</b> so any course can be checked directly. ITSM abstracts: <a href=\"https://www.helixops.ai/content/dam/bmc/education/Abstract_SPPT-ENT-SUBS-ITSM-WBT.pdf\" target=\"_blank\" rel=\"noopener\">Enterprise Web-Based</a> · <a href=\"https://www.helixops.ai/content/dam/bmc/education/Abstract_SPPT-IND-SUBS-ITSM-ASS.pdf\" target=\"_blank\" rel=\"noopener\">Individual Associate</a> · <a href=\"https://www.helixops.ai/content/dam/bmc/education/Abstract_SPPT-IND-SUBS-ITSM-PRO.pdf\" target=\"_blank\" rel=\"noopener\">Individual Professional</a>.</p>\n<p><b>Authorization to resell education.</b> Selling Helix education into an end customer normally needs that capability recognized in the partner authorization letter. Worth confirming before a training line goes into a bid.</p>\n</div>\n\n<div class=\"card card-pad section\">\n<h2 style=\"margin-top:0\">Who owes what</h2>\n<table style=\"table-layout:auto\">\n<thead><tr><th class=\"nosort\">Action</th><th class=\"nosort\">Owner</th><th class=\"nosort\">By</th></tr></thead>\n<tbody>\n<tr><td>Book Jesús Gavidia&rsquo;s Client Management 20.x renewal (expires 6 Nov) and Juan Ramos&rsquo;s Helix Dashboards 23.x (11 Nov)</td><td>STI</td><td>before 6 Nov</td></tr>\n<tr><td>Book the December group: Roxenis (18 Dec), Evelin and Rafael BCP (26 Dec), Juan Discovery 22.x ×3 (27 to 29 Dec)</td><td>STI</td><td>by end of November</td></tr>\n<tr><td>Decide recover-or-upgrade for the lapsed credentials, starting with Natasha and Naylin</td><td>STI</td><td>November</td></tr>\n<tr><td>Confirm whether Helix ITSM 22.x is retired when 23.x releases</td><td>Helix</td><td>open</td></tr>\n<tr><td>Participant names for HelixGPT and the Agent Creation session</td><td>Yelitza</td><td>open</td></tr>\n<tr><td>Claro Dominicana contract end date and the CLARO S.A. country and end date</td><td>Alicia</td><td>open</td></tr>\n<tr><td>Name the On-Premises 26.4 Preview participant and complete the three join steps</td><td>STI</td><td>open</td></tr>\n<tr><td>Confirm the subscription variant for the customer proposal</td><td>Yelitza + Helix</td><td>open</td></tr>\n<tr><td>Check whether the authorization letter covers education resale</td><td>STI</td><td>open</td></tr>\n<tr><td>Record a Portfolio Management demo once a test environment is available</td><td>Helix</td><td>open</td></tr>\n<tr><td>Decide the Juan Ramos Discovery 22.x to 24.x move before 27 December</td><td>STI</td><td>November</td></tr>\n<tr><td>Identify a second CMDB-certified engineer</td><td>STI</td><td>open</td></tr>\n<tr><td>Portfolio Management course corrected and available</td><td>Helix</td><td>Done, 19 Oct</td></tr>\n<tr><td>Documentation access case</td><td>Helix + STI</td><td>Closed, 19 Oct</td></tr>\n</tbody></table>\n</div>\n"});
Object.assign(I.es, {"tabCall": "Pendientes", "h1": "Soluciones en TI 2009 — Revisión de Educación y Certificaciones", "sub": "Dónde está cada certificación al 20 de octubre de 2026, cuáles vencen antes de que puedas asignar el próximo proyecto y cómo cambiar el roster de capacitación con un solo correo. Treinta y dos certificaciones ya vencieron, diecinueve de ellas desde finales de septiembre, y ningún examen de renovación está agendado. Seis más vencen en diciembre, antes de la ventana de exámenes de enero y febrero que se está considerando. El detalle operativo está en cada pestaña.", "execKicker": "Resumen ejecutivo · 20 de octubre de 2026", "execH": "Treinta y dos certificaciones ya vencieron, y el conteo de BCP para Premier baja de seis a fines de diciembre si no se agendan renovaciones ahora.", "execLede": "STI tiene {tot} registros de certificación en {ppl} consultores certificados, {act} activas y {exp} ya vencidas. Se completa el {pct}% de los cursos en los que se inscribe el equipo. La profundidad técnica es real. El riesgo es la concentración de fechas de vencimiento: {f27} de las {act} activas vencen antes del 31 de marzo de 2027, y solo {v} llegan a FY28.", "execGoodH": "Lo que está funcionando", "execGapH": "Dónde está el riesgo", "execG1": "{pct}% de finalización de cursos sobre {n} inscripciones, con {done} completadas.", "execG2": "{bcp} certificaciones de nivel Professional vigentes, en manos de {p} consultores.", "execG3": "Discovery, Operations Management, Client Management y CMDB están cubiertos hasta 2028 — {v} certificaciones pasan de FY27.", "execP1": "Diecinueve certificaciones vencieron entre el 24 de septiembre y el 15 de octubre. Natasha Oliveros y Naylin García ya no tienen ninguna certificación vigente, y Yelitza Viloria conserva solo su Professional de Helix ITSM. Al 20 de octubre no había ningún examen de renovación agendado.", "execP2": "{f} certificaciones en {p} consultores vencen antes del 31 de marzo de 2027 — el {pct}% de todo lo activo.", "execP3": "{z} líneas de producto quedan sin ningún consultor certificado después de FY27: {names}.", "execP4": "Los próximos vencimientos llegan antes de cualquier ventana de enero: Jesús Gavidia el 6 de noviembre, Juan Ramos el 11 de noviembre, Roxenis Sanoja el 18 de diciembre, Evelin Pabón y Rafael Obregón el 26 de diciembre, y de nuevo Juan Ramos del 27 al 29 de diciembre.", "tiles": [["Consultores con actividad de aprendizaje", "Soluciones en TI 2009 C.A. · Etech · Venezuela"], ["Inscripciones a cursos", "225 cursos distintos"], ["Completados", "{pct}% de todas las inscripciones"], ["Aún abiertos", "{ip} en progreso · {ns} sin iniciar"], ["Certificaciones registradas", "{bca} BCA · {bcp} BCP vigentes · en {ch} personas"], ["Vencen en FY27", "{f27bca} BCA · {f27bcp} BCP · {p} consultores"]], "revH": "Treinta y dos certificaciones ya vencieron. Ocho más vencen antes de fin de diciembre.", "revP": "<b>6 de noviembre:</b> Jesús Gavidia (Client Management 20.x).<br><b>11 de noviembre:</b> Juan Ramos (Helix Dashboards 23.x).<br><b>18 de diciembre:</b> Roxenis Sanoja, AR System 22.x y Helix ITSM 22.x.<br><b>26 de diciembre:</b> Evelin Pabón y Rafael Obregón, Professional de Helix ITSM 22.x.<br><b>Del 27 al 29 de diciembre:</b> Juan Ramos, Discovery 22.x ×3, incluida su Professional.<br><br>Vencidas desde la revisión anterior: Natasha Oliveros, Naylin García y Yelitza Viloria perdieron Digital Workplace Advanced License, AR System 22.x y Helix ITSM 22.x el 26 y 27 de septiembre. Juan Ramos perdió Service Monitoring, Continuous Optimization y Client Management 20.x. Arturo Martínez perdió cuatro y Christian Arámbulo tres entre el 3 y el 13 de octubre.", "entList": ["STI es <b>Premier</b>, lo que da una asignación FY27 de <b>hasta 30 personas</b> para educación técnica y certificación.", "La educación técnica y las certificaciones para los consultores de STI son <b>sin costo</b> dentro del programa Partner Success.", "Los <b>bootcamps están incluidos</b> en esa asignación.", "Eso cubre las renovaciones de esta revisión, las subidas a nivel Professional y la ruta de Portfolio Management.", "Nada de eso tiene que ir dentro de una propuesta a cliente ni de una bolsa de créditos de servicios."], "footer": "Preparado para Soluciones en TI 2009 por Partner Success, Learning @ Helix · Corte al 20 de octubre de 2026, actualizado el 22 de octubre · Fuente: exports NS Full Book de avance de cursos y certificaciones, filtrados a las sucursales de Soluciones en TI 2009 · Las cifras de precios y el detalle comercial se comparten por correo y no se publican aquí. Esta página es de uso interno entre STI y Helix.", "callBody": "\n<div class=\"card card-pad section\">\n<h2 style=\"margin-top:0\">Cómo usar esta página</h2>\n<p>Esta pestaña lleva el seguimiento de todo lo pendiente entre STI y Helix. Se actualizó el 22 de octubre de 2026 con el extracto de Learning @ Helix del 20 de octubre, antes de la llamada de seguimiento del 22 de octubre. Cada punto es una decisión que necesitamos de STI, una respuesta que debe Helix, o contexto para ambos. Las demás pestañas tienen los datos de base: el\n<b>Roster de consultores</b> permite hacer clic en cualquier nombre para ver su historial completo de cursos y certificaciones, la pestaña de\n<b>Certificaciones</b> lista cada credencial con su fecha de renovación, y la pestaña de <b>Banca certificada</b> muestra cuántas\npersonas hay certificadas por línea de producto hoy y después de este año fiscal.</p>\n<p class=\"note\">Dos términos que se usan en toda la página. <b>BCA</b> es BMC Certified Associate, la credencial\nbase. <b>BCP</b> es BMC Certified Professional, el nivel superior y el más escaso. Ambas cuentan para la acreditación de\npartner de STI. Cada certificación dura dos años desde su emisión, y una credencial vencida deja de contar el mismo día\nque vence, no al cierre del año.</p>\n</div>\n\n<div class=\"card card-pad section\" style=\"border-left:3px solid var(--good-ink)\">\n<h2 style=\"margin-top:0\">Qué avanzó desde septiembre</h2>\n<ul style=\"margin:4px 0 0;padding-left:18px\">\n<li><b>La formación de Portfolio Management ya está disponible.</b> Helix Education corrigió <em>BMC Helix Portfolio Management 26.3: Fundamentals (WBT)</em> y desde el 19 de octubre tiene el contenido completo. Yelitza Viloria y Natasha Oliveros se inscribieron el 13 de octubre y lo tienen en progreso.</li>\n<li><b>Yelitza comenzó la ruta de despliegue on-premises.</b> El 14 de octubre se inscribió en cuatro cursos de despliegue de Helix Service Management y en el examen <em>Certified Associate: Helix Service Management On-Premises Deployment 25.x</em>. Encaja directamente con la invitación al Programa Preview de Helix On-Premises 26.4 enviada el 19 de octubre.</li>\n<li><b>Rafael Obregón avanza en Innovation Studio.</b> Se inscribió el 10 de septiembre en el curso autoasistido de Innovation Studio 26.x y tiene en progreso el examen <em>Certified Associate: Helix Innovation Studio 26.x for Developers</em>. Innovation Studio es la plataforma sobre la que está construido Portfolio Management.</li>\n<li><b>El caso de acceso a la documentación está cerrado.</b> Natasha confirmó el 19 de octubre que los enlaces ya abren el sitio de documentación de Helix. El error venía de enlaces antiguos que todavía apuntaban al dominio anterior.</li>\n</ul>\n</div>\n\n<div class=\"card card-pad section\" style=\"border-left:3px solid var(--critical)\">\n<h2 style=\"margin-top:0\">Lo que sigue abierto</h2>\n<p class=\"note\" style=\"margin-top:0\">Las llamadas del 10 y del 24 de septiembre no se pudieron realizar, así que el seguimiento fue por correo. La última conversación en vivo fue el 8 de octubre. Esta lista recoge todo lo ocurrido desde entonces.</p>\n\n<h3 style=\"margin-bottom:2px\">Lo que Helix necesita de STI</h3>\n<ol class=\"steps\">\n<li><b>Una fecha de renovación para el grupo de diciembre, antes de que termine noviembre.</b> El 8 de octubre los coordinadores de área planeaban presentar en enero o febrero de 2027. Eso llega tarde para seis credenciales que vencen en diciembre: AR System 22.x y Helix ITSM 22.x de Roxenis Sanoja (18 de diciembre), la Professional de Helix ITSM 22.x de Evelin Pabón y de Rafael Obregón (26 de diciembre), y las tres credenciales de Discovery 22.x de Juan Ramos, incluida su Professional (27 al 29 de diciembre). Antes vienen dos más: Client Management 20.x de Jesús Gavidia el 6 de noviembre y Helix Dashboards 23.x de Juan el 11 de noviembre. La recertificación hay que aprobarla <em>antes</em> de la fecha de vencimiento.\n<br><span class=\"note\">Responsable: STI · Según el extracto del 20 de octubre, ninguno de estos exámenes de renovación está agendado.</span></li>\n\n<li><b>Una decisión sobre las credenciales que ya vencieron.</b> Desde la revisión anterior vencieron diecinueve más, entre el 24 de septiembre y el 15 de octubre. Natasha Oliveros y Naylin García ya no tienen ninguna certificación vigente. Yelitza Viloria conserva solo su Professional de Helix ITSM 22.x. Arturo Martínez, Christian Arámbulo y Juan Ramos perdieron a inicios de octubre credenciales de Service Monitoring, Continuous Optimization, Operations Management y Client Management 20.x. Para cada una, la decisión es recuperar la misma versión o pasar a la vigente, que dura dos años.\n<br><span class=\"note\">Responsable: STI · Helix está confirmando con Educación si Helix ITSM 22.x sigue disponible cuando salga la 23.x, para que la elección de versión no sea esfuerzo perdido.</span></li>\n\n<li><b>Nombres de participantes para los bootcamps.</b> La sesión de HelixGPT del 12 de octubre para las Américas pasó sin participantes de STI. Helix también está midiendo el interés en una sesión adicional de Agent Creation en horario de las Américas (cinco medios días, en inglés) y pidió nombres y si alguien tiene su propio tenant de Helix. Víctor Touza es buen candidato: sus dos certificaciones llegan a 2028 y no tiene renovaciones este año.\n<br><span class=\"note\">Responsable: STI · Con nombres provisionales basta para reservar cupos.</span></li>\n\n<li><b>Dos datos sobre los registros de Claro Dominicana.</b> Para el servicio gestionado (PS-00001173): la fecha exacta de término del contrato en 2029 y si la consultoría de Discovery (PS-00001169) forma parte de él. Para el proyecto de Discovery de 2024 registrado como &ldquo;CLARO S.A.&rdquo; (PS-00000372): de qué país es y en qué fecha terminó.\n<br><span class=\"note\">Responsable: Alicia Salazar · Consultado el 20 de octubre</span></li>\n\n<li><b>Quién participa en el Programa Preview de On-Premises 26.4.</b> Es por invitación y está pensado para el consultor que hace las implementaciones contenerizadas on-premises. Para unirse hay tres pasos: una cuenta en Helix Community, el Customer Programs Agreement firmado con el nombre legal completo de la empresa y la solicitud de acceso a la comunidad del programa.\n<br><span class=\"note\">Responsable: STI · Invitación enviada el 19 de octubre</span></li>\n\n<li><b>Los pendientes de la propuesta de cursos para cliente.</b> Qué variante de suscripción debe llevar la propuesta, si la carta de autorización de STI cubre la reventa de servicios de educación, y el nombre exacto o una captura del curso de HelixGPT que consultó Yelitza.\n<br><span class=\"note\">Responsable: Yelitza</span></li>\n</ol>\n\n<h3 style=\"margin-bottom:2px\">Lo que Helix le debe a STI</h3>\n<ol class=\"steps\">\n<li><b>Una respuesta por escrito sobre Helix ITSM 22.x frente a 23.x.</b> Si el examen 22.x se retira cuando salga la 23.x, para que el equipo estudie la versión que va a seguir existiendo.\n<br><span class=\"note\">Responsable: Helix · En confirmación con Educación</span></li>\n<li><b>Un demo grabado de Portfolio Management</b> cuando haya un ambiente de pruebas disponible, como complemento del curso.\n<br><span class=\"note\">Responsable: Helix · Abierto</span></li>\n<li><b>El registro de los estatus de clientes y proyectos</b> en Tech Central a medida que STI los confirme.\n<br><span class=\"note\">Responsable: Helix, al recibirlos</span></li>\n</ol>\n</div>\n\n<div class=\"card card-pad section\" style=\"border-left:3px solid var(--brand)\">\n<h2 style=\"margin-top:0\">Por qué las fechas de diciembre importan para Premier</h2>\n<p>El programa de partners FY27 cuenta <b>individuos BCP</b>, es decir personas, no certificados. Premier pide <b>seis</b>. Hoy STI tiene <b>siete</b>: Christian Arámbulo, Deiry Arias, Evelin Pabón, Juan Ramos, Rafael Obregón, Roxenis Sanoja y Yelitza Viloria.</p>\n<ul style=\"margin:4px 0 0;padding-left:18px\">\n<li><b>Del 26 al 29 de diciembre de 2026:</b> vencen las únicas credenciales Professional de Evelin y de Juan, y con ellas la Professional de Helix ITSM de Rafael. Rafael conserva su Professional de CMDB. El conteo baja a <b>cinco</b>, por debajo del mínimo Premier.</li>\n<li><b>Del 24 al 30 de marzo de 2027:</b> vencen las Professional de Helix ITSM de Roxenis y de Yelitza, y la de ITSM de Deiry. El conteo baja a <b>tres</b>: Christian, Deiry y Rafael.</li>\n</ul>\n<p>Aparte, si no se renueva nada, <b>Helix ITSM y AR System quedan en cero personas certificadas después de marzo de 2027</b>, y Digital Workplace ya depende solo de Deiry Arias. Son las líneas de producto sobre las que corre la entrega actual.</p>\n<p>La formación técnica y la certificación de los consultores de STI son <b>sin costo</b> dentro de la asignación Premier, que cubre hasta 30 personas al año. Las renovaciones, las recuperaciones y las subidas a Professional caben ahí.</p>\n</div>\n\n<div class=\"card card-pad section\" style=\"border-left:3px solid var(--warning)\">\n<h2 style=\"margin-top:0\">Portfolio Management: dónde está la formación hoy</h2>\n<p><b>El primer curso ya está disponible.</b> <em>BMC Helix Portfolio Management 26.3: Fundamentals (WBT)</em> se puede tomar sin costo. El 14 de octubre STI reportó que solo abría una encuesta de evaluación. Educación lo corrigió y el contenido completo está cargado desde el 19 de octubre. Si alguien completó la encuesta antes de esa fecha, el curso puede aparecer como terminado sin el contenido. Avísennos y pedimos que lo reinicien.</p>\n<p><b>En progreso:</b> Yelitza Viloria y Natasha Oliveros, ambas inscritas el 13 de octubre.</p>\n<p><b>La grabación del webinar.</b> Helix realizó el 21 de octubre un webinar abierto, <em>From Strategy to Delivery: HPM, Waterfall &amp; Agile in Practice</em>. Registrándose en la página del evento se recibe la grabación.</p>\n<p><b>La base sigue aplicando.</b> Portfolio Management está construido sobre Innovation Studio, Digital Workplace Catalog y Helix Dashboards, las mismas tres áreas que el servicio oficial de implementación pide que conozca el equipo del cliente. El avance de Rafael Obregón en Innovation Studio y la Professional de Digital Workplace de Deiry Arias son directamente relevantes.</p>\n<p><b>Todavía sin confirmar:</b> si habrá un examen de certificación de Portfolio Management. No se ha anunciado ninguno.</p>\n</div>\n\n<div class=\"card card-pad section\">\n<h2 style=\"margin-top:0\">Bootcamps: qué son y qué está pendiente</h2>\n<p>Sesiones grupales programadas, con instructor y un ambiente práctico por participante, por eso los cupos tienen tope entre todos los partners. <b>HelixGPT</b> cubre la capa de IA de Helix. <b>Agent Creation</b> cubre la construcción de agentes de IA sobre esa capa, así que HelixGPT va primero.</p>\n<p>STI no arranca de cero. Juan Ramos, Yelitza Viloria, Natasha Oliveros y Rafael Obregón completaron el bootcamp de ITSM/ITOM Container, y Juan además completó Advanced AIOps y el Solution Demo bootcamp. <b>Evelin Pabón</b> y <b>Deiry Arias</b> son quienes más han avanzado por su cuenta en HelixGPT, y Deiry tiene en progreso el examen <em>Certified Associate: HelixGPT 23.x for Users</em>. Son los nombres naturales para la próxima sesión de HelixGPT.</p>\n<p class=\"note\">Nota de datos: varios registros de bootcamp tienen fecha de inscripción del 17 de junio de 2026 con fechas de finalización entre 2023 y 2025. Es un efecto de la migración de la plataforma de aprendizaje. Las finalizaciones son reales, las fechas de inscripción no. El bootcamp de ITSM/ITOM Container además aparece con dos títulos de catálogo, así que una asistencia puede verse como dos registros.</p>\n</div>\n\n<div class=\"card card-pad section\">\n<h2 style=\"margin-top:0\">La propuesta de cursos para cliente — <em>Validación de Propuesta Cursos para cliente</em></h2>\n<p class=\"note\" style=\"margin-top:0\">Confirmado por Luis Corona, Helix Education, el 27 de agosto. Las cifras de precios se enviaron por correo y no se reproducen aquí.</p>\n<p><b>Solo hay dos familias de suscripción: ITSM e ITOM.</b> Las seis áreas de producto de la propuesta (Helix ITSM, Digital Workplace, Innovation Studio, Business Workflows, Dashboards y CMDB) están dentro de la familia ITSM, así que una sola suscripción ITSM las cubre todas. República Dominicana y Venezuela comparten la banda de precios LA South.</p>\n<div class=\"scroll\"><table style=\"table-layout:auto\">\n<thead><tr><th class=\"nosort\">Opción</th><th class=\"nosort\">A quién cubre</th><th class=\"nosort\">Duración</th><th class=\"nosort\">Modalidades</th><th class=\"nosort\">Certificación</th></tr></thead><tbody>\n<tr><td><b>Enterprise Web-Based</b></td><td>Empleados ilimitados de toda la empresa</td><td>12 meses</td><td>Solo cursos web (WBT) y exámenes en línea</td><td>Hasta Associate</td></tr>\n<tr><td><b>Individual Associate</b></td><td>Una persona nombrada</td><td>6 meses</td><td>WBT, con instructor (ILT) y autoasistidos (ASP)</td><td>Associate</td></tr>\n<tr><td><b>Individual Professional</b></td><td>Una persona nombrada</td><td>12 meses</td><td>WBT, ILT y ASP</td><td>Associate y Professional</td></tr>\n</tbody></table></div>\n<p><b>El límite que suele confundir:</b> la Enterprise incluye los <em>exámenes</em> Associate de administrador, pero no la <em>formación</em> de administrador de varios días que prepara para aprobarlos. El documento <a href=\"https://www.helixops.ai/content/dam/bmc/education/BMCHelix_Learning_Tracks.pdf\" target=\"_blank\" rel=\"noopener\">Learning Paths and Certifications</a> marca cada curso con <b>E</b>, <b>A</b> o <b>P</b>, así que cualquier curso se puede verificar directamente. Abstracts ITSM: <a href=\"https://www.helixops.ai/content/dam/bmc/education/Abstract_SPPT-ENT-SUBS-ITSM-WBT.pdf\" target=\"_blank\" rel=\"noopener\">Enterprise Web-Based</a> · <a href=\"https://www.helixops.ai/content/dam/bmc/education/Abstract_SPPT-IND-SUBS-ITSM-ASS.pdf\" target=\"_blank\" rel=\"noopener\">Individual Associate</a> · <a href=\"https://www.helixops.ai/content/dam/bmc/education/Abstract_SPPT-IND-SUBS-ITSM-PRO.pdf\" target=\"_blank\" rel=\"noopener\">Individual Professional</a>.</p>\n<p><b>Autorización para revender educación.</b> Vender educación de Helix a un cliente final normalmente requiere que esa capacidad figure en la carta de autorización del partner. Conviene confirmarlo antes de incluir una línea de formación en una licitación.</p>\n</div>\n\n<div class=\"card card-pad section\">\n<h2 style=\"margin-top:0\">Quién debe qué</h2>\n<table style=\"table-layout:auto\">\n<thead><tr><th class=\"nosort\">Acción</th><th class=\"nosort\">Responsable</th><th class=\"nosort\">Para</th></tr></thead>\n<tbody>\n<tr><td>Agendar la renovación de Client Management 20.x de Jesús Gavidia (vence el 6 nov) y Helix Dashboards 23.x de Juan Ramos (11 nov)</td><td>STI</td><td>antes del 6 nov</td></tr>\n<tr><td>Agendar el grupo de diciembre: Roxenis (18 dic), BCP de Evelin y Rafael (26 dic), Discovery 22.x ×3 de Juan (27 al 29 dic)</td><td>STI</td><td>antes de fin de noviembre</td></tr>\n<tr><td>Decidir recuperar o actualizar las credenciales vencidas, empezando por Natasha y Naylin</td><td>STI</td><td>noviembre</td></tr>\n<tr><td>Confirmar si Helix ITSM 22.x se retira cuando salga la 23.x</td><td>Helix</td><td>abierto</td></tr>\n<tr><td>Nombres para HelixGPT y para la sesión de Agent Creation</td><td>Yelitza</td><td>abierto</td></tr>\n<tr><td>Fecha de término del contrato de Claro Dominicana y país y fecha de término de CLARO S.A.</td><td>Alicia</td><td>abierto</td></tr>\n<tr><td>Nombrar al participante del Preview de On-Premises 26.4 y completar los tres pasos</td><td>STI</td><td>abierto</td></tr>\n<tr><td>Confirmar la variante de suscripción para la propuesta al cliente</td><td>Yelitza + Helix</td><td>abierto</td></tr>\n<tr><td>Verificar si la carta de autorización cubre la reventa de educación</td><td>STI</td><td>abierto</td></tr>\n<tr><td>Grabar un demo de Portfolio Management cuando haya ambiente de pruebas</td><td>Helix</td><td>abierto</td></tr>\n<tr><td>Decidir el paso de Juan Ramos de Discovery 22.x a 24.x antes del 27 de diciembre</td><td>STI</td><td>noviembre</td></tr>\n<tr><td>Identificar un segundo ingeniero certificado en CMDB</td><td>STI</td><td>abierto</td></tr>\n<tr><td>Curso de Portfolio Management corregido y disponible</td><td>Helix</td><td>Hecho, 19 oct</td></tr>\n<tr><td>Caso de acceso a la documentación</td><td>Helix + STI</td><td>Cerrado, 19 oct</td></tr>\n</tbody></table>\n</div>\n"});

function buildExec(){
  const pct = Math.round(100*T.completed/T.enrollments);
  const zero = BENCH.filter(b=>b.remaining===0);
  const f27pct = Math.round(100*T.fy27/(T.certs - T.expiredNow));
  $('#exec').innerHTML = `
    <div class="kicker">${t('execKicker')}</div>
    <h2>${t('execH')}</h2>
    <p class="lede">${t('execLede',{tot:T.certs, ppl:T.certHolders, act:T.certs-T.expiredNow, exp:T.expiredNow,
       pct, f27:T.fy27, v:T.validPast27})}</p>
    <div class="execsplit">
      <div><h3 style="color:var(--good-ink)">${t('execGoodH')}</h3><ul>
        <li>${t('execG1',{pct, n:nf(T.enrollments), done:nf(T.completed)})}</li>
        <li>${t('execG2',{bcp:T.bcp, p:T.bcpPeople})}</li>
        <li>${t('execG3',{v:T.validPast27})}</li>
      </ul></div>
      <div><h3 style="color:var(--critical)">${t('execGapH')}</h3><ul>
        <li>${t('execP1')}</li>
        <li>${t('execP2',{f:T.fy27, p:T.fy27People, pct:f27pct})}</li>
        <li>${t('execP3',{z:zero.length, names:zero.map(x=>x.family).join(', ')})}</li>
        <li>${t('execP4')}</li>
      </ul></div>
    </div>`;
}
